<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>طيف</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#dfe6ee">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap">
<style>
/* طيف — mobile, casual clean look: light grey-blue page, white raised board, slate floor, bright cute blobs.
   One screen: top bar (level badge), the board, three big buttons. */
:root {
  --page: #dfe6ee;
  --ink: #33405a;
  --soft: #7b879c;
  --blue: #4f8ff7;  --blueDk: #2f6fd6;
  --purple: #8b5cf6; --purpleDk: #6a3fd6;
  --white: #ffffff; --lip: #c7d1de;
  --orange: #ff8a3d;
  --font: "Baloo Bhaijaan 2", "Noto Sans Arabic", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--page); color: var(--ink); font-family: var(--font);
  overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
button { font-family: inherit; }

/* ---------- top bar ---------- */
#top {
  position: fixed; top: 0; inset-inline: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: start;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 0; pointer-events: none;
}
.side { display: flex; gap: 8px; align-items: center; }
.side.end { justify-content: flex-end; }
.round {
  pointer-events: auto; width: 44px; height: 44px; border-radius: 14px; border: 0; padding: 0; cursor: pointer;
  background: linear-gradient(#6aa3ff, var(--blue)); box-shadow: 0 4px 0 var(--blueDk), 0 6px 10px #2f6fd633;
  color: #fff; display: grid; place-items: center; transition: transform .1s, box-shadow .1s;
}
.round:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--blueDk); }
.round svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
svg .f { fill: currentColor; stroke-width: 1.2; }
.round.off .w, .round .x { display: none; }
.round.off .x { display: inline; }
.round.dim { opacity: .45; }
#mid { display: flex; flex-direction: column; align-items: center; }
#level {
  background: linear-gradient(#a27bff, var(--purple)); color: #fff; font-weight: 800; font-size: 20px; line-height: 1;
  padding: 9px 18px 8px; border-radius: 14px; box-shadow: 0 4px 0 var(--purpleDk), 0 6px 12px #6a3fd633; white-space: nowrap;
}
#steps {
  margin-top: 8px; background: #fff; color: var(--ink); font-weight: 700; font-size: 15px; line-height: 1;
  padding: 6px 12px 5px; border-radius: 99px; box-shadow: 0 3px 0 var(--lip); display: flex; align-items: center; gap: 6px; white-space: nowrap;
  transition: color .2s, background .2s;
}
#steps.low { background: #ffe3dc; color: #e2553a; }
#steps svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 0; color: var(--purple); }
#steps.low svg { color: #e2553a; }
#echoes {
  background: #fff; border-radius: 99px; box-shadow: 0 3px 0 var(--lip); padding: 6px 10px; display: flex; gap: 5px; align-items: center;
}
#echoes i { width: 24px; height: 22px; display: block; opacity: .35; transition: opacity .3s, transform .3s; }
#echoes i svg { width: 100%; height: 100%; display: block; }
#echoes i svg path:first-child { fill: #7cc6ff; }
#echoes i.on { opacity: 1; transform: scale(1.1); }

/* ---------- bottom buttons ---------- */
#bar {
  position: fixed; bottom: 0; inset-inline: 0; display: flex; justify-content: center; gap: 18px;
  padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 18px);
}
.big {
  position: relative; width: 74px; height: 74px; border-radius: 22px; border: 0; padding: 0; cursor: pointer;
  background: #fff; box-shadow: 0 5px 0 var(--lip), 0 8px 16px #33405a1f; color: var(--ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; transition: transform .1s, box-shadow .1s, opacity .2s;
}
.big:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--lip); }
.big .ic { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; color: #fff; box-shadow: inset 0 -3px 0 #0000001f, inset 0 2px 0 #ffffff55; }
.big .ic svg { filter: drop-shadow(0 1.5px 0 #00000026); }
.big .ic svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.big b { font-size: 12px; font-weight: 700; line-height: 1.1; color: var(--soft); }
#bWait .ic { background: linear-gradient(#5fd3a0, #2fb47c); }
#bUndo .ic { background: linear-gradient(#ffb44d, #f59316); }
#bHelp .ic { background: linear-gradient(#ff7aa8, #f2457f); }
.big.dim { opacity: .45; }
.badge {
  position: absolute; top: -8px; left: -8px; min-width: 26px; height: 26px; border-radius: 13px; padding: 0 6px; box-sizing: border-box;
  background: #ff4f4f; color: #fff; font-weight: 800; font-size: 15px; line-height: 27px; box-shadow: 0 2px 0 #c42f2f; border: 2px solid #fff;
}
.badge.free { background: #2fb47c; box-shadow: 0 2px 0 #1d8a5b; font-size: 12px; }
.big.pulse { animation: pulse 1.3s ease-in-out infinite; }
/* hold «انتظر» to end the loop: a ring fills around the icon */
.big .ic { position: relative; }
.big.holding .ic::after { content: ''; position: absolute; inset: -5px; border-radius: 17px; border: 3px solid #2fb47c; clip-path: inset(100% 0 0 0); animation: fillup .55s linear forwards; }
@keyframes fillup { to { clip-path: inset(0 0 0 0); } }
.big.armed { box-shadow: 0 5px 0 #f2457f, 0 0 0 4px #ff7aa855; }
@keyframes pulse { 50% { transform: translateY(-4px) scale(1.06); } }
.big:focus-visible, .round:focus-visible { outline: 3px solid var(--purple); outline-offset: 3px; }

#tip {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 116px); transform: translate(-50%, 6px); width: min(340px, calc(100% - 40px));
  background: #33405aee; color: #fff; font-weight: 600; font-size: 15px; line-height: 1.45; text-align: center; padding: 8px 14px 7px; border-radius: 14px;
  opacity: 0; transition: opacity .35s, transform .35s; pointer-events: none; box-sizing: border-box;
}
#tip.on { opacity: 1; transform: translate(-50%, 0); }
#cheer {
  position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(.3); opacity: 0; pointer-events: none;
  font-size: 56px; font-weight: 800; color: #fff; -webkit-text-stroke: 7px var(--purple); paint-order: stroke fill;
  text-shadow: 0 6px 0 var(--purpleDk), 0 10px 20px #6a3fd655; white-space: nowrap;
}
#cheer.on { animation: cheer 1.5s cubic-bezier(.2, 1.6, .4, 1) forwards; }
@keyframes cheer { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.3) rotate(-8deg); } 18% { opacity: 1; transform: translate(-50%, -50%) scale(1.08) rotate(3deg); }
  30% { transform: translate(-50%, -50%) scale(1) rotate(0); } 80% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -62%) scale(.9); } }
#toast {
  position: fixed; top: 38%; left: 50%; transform: translate(-50%, -50%) scale(.8); opacity: 0; pointer-events: none;
  background: #fff; color: var(--ink); font-weight: 800; font-size: 20px; padding: 10px 20px; border-radius: 16px; box-shadow: 0 5px 0 var(--lip);
  transition: opacity .2s, transform .2s; white-space: nowrap;
}
#toast.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }

/* ---------- title ---------- */
#title {
  position: fixed; inset: 0; background: radial-gradient(circle at 50% 38%, #fff 0, #e6ecf4 45%, #d5dde9 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  cursor: pointer; z-index: 5;
}
#title[hidden] { display: none; }   /* the display:flex above would otherwise keep it (invisible) over the game, eating every tap */
#tcv { width: 180px; height: 180px; }
#title h1 { margin: 0; font-size: 84px; line-height: 1; font-weight: 800; color: #fff; -webkit-text-stroke: 10px var(--ink); paint-order: stroke fill; text-shadow: 0 7px 0 #1f2a40; letter-spacing: 0; }
#title .by { font-size: 14px; font-weight: 700; color: var(--soft); letter-spacing: .5px; margin-top: 30px; }
#title p { margin: 4px 24px 26px; font-size: 18px; color: var(--soft); text-align: center; font-weight: 500; }
#colors { display: flex; gap: 10px; margin: -8px 0 22px; }
#colors .sw { width: 34px; height: 34px; border-radius: 10px; border: 0; cursor: pointer; box-shadow: inset 0 -4px 0 #0002, 0 2px 0 #0001; transition: transform .15s; }
#colors .sw[aria-pressed=true] { transform: translateY(-3px) scale(1.12); box-shadow: inset 0 -4px 0 #0002, 0 0 0 3px #fff, 0 0 0 5px var(--ink); }
#play {
  border: 0; cursor: pointer; font-size: 26px; font-weight: 800; color: #fff; padding: 12px 54px 10px; border-radius: 20px;
  background: linear-gradient(#5fd3a0, #2fb47c); box-shadow: 0 6px 0 #1d8a5b, 0 10px 18px #1d8a5b33;
}
#play:active { transform: translateY(4px); box-shadow: 0 2px 0 #1d8a5b; }
</style>
</head>
<body>
<canvas id="cv" aria-label="لوحة اللعب"></canvas>

<header id="top">
  <div class="side">
    <button class="round" id="bBack" aria-label="ارجع لبداية الدورة">
      <svg viewBox="0 0 24 24"><path d="M5.2 13.5A7 7 0 1 0 7.5 6.8"/><path class="f" d="M3.2 4.6 4.4 11l5.8-3z"/></svg>
    </button>
    <button class="round" id="bSound" aria-label="الصوت">
      <svg viewBox="0 0 24 24"><path class="f" d="M3.5 9h3.8L12.5 4.8v14.4L7.3 15H3.5z"/><path class="w" d="M16 9a4 4 0 0 1 0 6M18.6 6.4a7.6 7.6 0 0 1 0 11.2"/><path class="x" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
    </button>
  </div>
  <div id="mid">
    <div id="level">مرحلة ١</div>
    <div id="steps"><svg viewBox="0 0 24 24"><path class="f" d="M8.5 3c2 0 3 2.2 3 4.6S10.2 12 8.6 12 5.5 10 5.5 7.6 6.5 3 8.5 3zM6.4 13.5h4.2c.3 2-.6 3.8-2.1 3.8s-2.3-1.8-2.1-3.8zM15.5 7c2 0 3 2.2 3 4.6s-1.3 4.4-2.9 4.4-3.1-2-3.1-4.4S13.5 7 15.5 7zM13.4 17.5h4.2c.3 2-.6 3.8-2.1 3.8s-2.3-1.8-2.1-3.8z"/></svg><span id="stepsN">٨</span></div>
  </div>
  <div class="side end"><div id="echoes" aria-label="الأطياف"></div></div>
</header>

<nav id="bar">
  <button class="big" id="bHelp" aria-label="مساعدة">
    <span class="badge" id="helpN">٢</span>
    <span class="ic" id="helpIc"></span><b id="helpLb">تلميح</b>
  </button>
  <button class="big" id="bUndo" aria-label="تراجع خطوة">
    <span class="ic"><svg viewBox="0 0 24 24"><path class="f" d="M10.5 3.5 3 9.5l7.5 6v-3.8h3.7a3.4 3.4 0 0 1 0 6.8H12v3.2h2.2a6.6 6.6 0 0 0 0-13.2h-3.7z"/></svg></span><b>تراجع</b>
  </button>
  <button class="big" id="bWait" aria-label="انتظر دورة">
    <span class="ic"><svg viewBox="0 0 24 24"><path d="M6 3h12M6 21h12"/><path class="f" d="M7.5 4.5h9c0 3.6-2.8 5.4-4.5 7.5-1.7-2.1-4.5-3.9-4.5-7.5zM12 13.4c1.3 1.6 3.8 3 4.3 6.1H7.7c.5-3.1 3-4.5 4.3-6.1z" opacity=".95"/></svg></span><b>انتظر</b>
  </button>
</nav>
<div id="tip" role="note"></div>
<div id="cheer" aria-live="polite"></div>
<div id="toast" role="status"></div>

<div id="title" tabindex="0" role="button" aria-label="ابدأ">
  <canvas id="tcv" width="360" height="360"></canvas>
  <h1>طيف</h1>
  <p>كل محاولة تترك طيفًا يعيد خطواتك… ويفتح لك الطريق</p>
  <div id="colors" role="group" aria-label="لون المكعب"></div>
  <button id="play">العب</button>
  <div class="by">عبودين قيمز</div>
</div>
