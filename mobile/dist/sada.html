<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>طيف</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#dfe6ee">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap">
<style>
/* طيف — mobile, casual clean look: light grey-blue page, white raised board, slate floor, bright cute blobs.
   One screen: top bar (level badge), the board, three big buttons. */
:root {
  --page: #dfe6ee;
  --ink: #33405a;
  --soft: #7b879c;
  --blue: #4f8ff7;  --blueDk: #2f6fd6;
  --purple: #8b5cf6; --purpleDk: #6a3fd6;
  --white: #ffffff; --lip: #c7d1de;
  --orange: #ff8a3d;
  --font: "Baloo Bhaijaan 2", "Noto Sans Arabic", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--page); color: var(--ink); font-family: var(--font);
  overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
button { font-family: inherit; }

/* ---------- top bar ---------- */
#top {
  position: fixed; top: 0; inset-inline: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: start;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 0; pointer-events: none;
}
.side { display: flex; gap: 8px; align-items: center; }
.side.end { justify-content: flex-end; }
.round {
  pointer-events: auto; width: 44px; height: 44px; border-radius: 14px; border: 0; padding: 0; cursor: pointer;
  background: linear-gradient(#6aa3ff, var(--blue)); box-shadow: 0 4px 0 var(--blueDk), 0 6px 10px #2f6fd633;
  color: #fff; display: grid; place-items: center; transition: transform .1s, box-shadow .1s;
}
.round:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--blueDk); }
.round svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
svg .f { fill: currentColor; stroke-width: 1.2; }
.round.off .w, .round .x { display: none; }
.round.off .x { display: inline; }
.round.dim { opacity: .45; }
#mid { display: flex; flex-direction: column; align-items: center; }
#level {
  background: linear-gradient(#a27bff, var(--purple)); color: #fff; font-weight: 800; font-size: 20px; line-height: 1;
  padding: 9px 18px 8px; border-radius: 14px; box-shadow: 0 4px 0 var(--purpleDk), 0 6px 12px #6a3fd633; white-space: nowrap;
}
#steps {
  margin-top: 8px; background: #fff; color: var(--ink); font-weight: 700; font-size: 15px; line-height: 1;
  padding: 6px 12px 5px; border-radius: 99px; box-shadow: 0 3px 0 var(--lip); display: flex; align-items: center; gap: 6px; white-space: nowrap;
  transition: color .2s, background .2s;
}
#steps.low { background: #ffe3dc; color: #e2553a; }
#steps svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 0; color: var(--purple); }
#steps.low svg { color: #e2553a; }
#echoes {
  background: #fff; border-radius: 99px; box-shadow: 0 3px 0 var(--lip); padding: 6px 10px; display: flex; gap: 5px; align-items: center;
}
#echoes i { width: 24px; height: 22px; display: block; opacity: .35; transition: opacity .3s, transform .3s; }
#echoes i svg { width: 100%; height: 100%; display: block; }
#echoes i svg path:first-child { fill: #7cc6ff; }
#echoes i.on { opacity: 1; transform: scale(1.1); }

/* ---------- bottom buttons ---------- */
#bar {
  position: fixed; bottom: 0; inset-inline: 0; display: flex; justify-content: center; gap: 18px;
  padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 18px);
}
.big {
  position: relative; width: 74px; height: 74px; border-radius: 22px; border: 0; padding: 0; cursor: pointer;
  background: #fff; box-shadow: 0 5px 0 var(--lip), 0 8px 16px #33405a1f; color: var(--ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; transition: transform .1s, box-shadow .1s, opacity .2s;
}
.big:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--lip); }
.big .ic { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; color: #fff; box-shadow: inset 0 -3px 0 #0000001f, inset 0 2px 0 #ffffff55; }
.big .ic svg { filter: drop-shadow(0 1.5px 0 #00000026); }
.big .ic svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.big b { font-size: 12px; font-weight: 700; line-height: 1.1; color: var(--soft); }
#bWait .ic { background: linear-gradient(#5fd3a0, #2fb47c); }
#bUndo .ic { background: linear-gradient(#ffb44d, #f59316); }
#bHelp .ic { background: linear-gradient(#ff7aa8, #f2457f); }
.big.dim { opacity: .45; }
.badge {
  position: absolute; top: -8px; left: -8px; min-width: 26px; height: 26px; border-radius: 13px; padding: 0 6px; box-sizing: border-box;
  background: #ff4f4f; color: #fff; font-weight: 800; font-size: 15px; line-height: 27px; box-shadow: 0 2px 0 #c42f2f; border: 2px solid #fff;
}
.badge.free { background: #2fb47c; box-shadow: 0 2px 0 #1d8a5b; font-size: 12px; }
.big.pulse { animation: pulse 1.3s ease-in-out infinite; }
.big.armed { box-shadow: 0 5px 0 #f2457f, 0 0 0 4px #ff7aa855; }
@keyframes pulse { 50% { transform: translateY(-4px) scale(1.06); } }
.big:focus-visible, .round:focus-visible { outline: 3px solid var(--purple); outline-offset: 3px; }

#tip {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 116px); transform: translate(-50%, 6px); width: min(340px, calc(100% - 40px));
  background: #33405aee; color: #fff; font-weight: 600; font-size: 15px; line-height: 1.45; text-align: center; padding: 8px 14px 7px; border-radius: 14px;
  opacity: 0; transition: opacity .35s, transform .35s; pointer-events: none; box-sizing: border-box;
}
#tip.on { opacity: 1; transform: translate(-50%, 0); }
#cheer {
  position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(.3); opacity: 0; pointer-events: none;
  font-size: 56px; font-weight: 800; color: #fff; -webkit-text-stroke: 7px var(--purple); paint-order: stroke fill;
  text-shadow: 0 6px 0 var(--purpleDk), 0 10px 20px #6a3fd655; white-space: nowrap;
}
#cheer.on { animation: cheer 1.5s cubic-bezier(.2, 1.6, .4, 1) forwards; }
@keyframes cheer { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.3) rotate(-8deg); } 18% { opacity: 1; transform: translate(-50%, -50%) scale(1.08) rotate(3deg); }
  30% { transform: translate(-50%, -50%) scale(1) rotate(0); } 80% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -62%) scale(.9); } }
#toast {
  position: fixed; top: 38%; left: 50%; transform: translate(-50%, -50%) scale(.8); opacity: 0; pointer-events: none;
  background: #fff; color: var(--ink); font-weight: 800; font-size: 20px; padding: 10px 20px; border-radius: 16px; box-shadow: 0 5px 0 var(--lip);
  transition: opacity .2s, transform .2s; white-space: nowrap;
}
#toast.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }

/* ---------- title ---------- */
#title {
  position: fixed; inset: 0; background: radial-gradient(circle at 50% 38%, #fff 0, #e6ecf4 45%, #d5dde9 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  cursor: pointer; z-index: 5;
}
#tcv { width: 180px; height: 180px; }
#title h1 { margin: 0; font-size: 84px; line-height: 1; font-weight: 800; color: #fff; -webkit-text-stroke: 10px var(--ink); paint-order: stroke fill; text-shadow: 0 7px 0 #1f2a40; letter-spacing: 0; }
#title .by { font-size: 14px; font-weight: 700; color: var(--soft); letter-spacing: .5px; margin-top: 30px; }
#title p { margin: 4px 24px 26px; font-size: 18px; color: var(--soft); text-align: center; font-weight: 500; }
#play {
  border: 0; cursor: pointer; font-size: 26px; font-weight: 800; color: #fff; padding: 12px 54px 10px; border-radius: 20px;
  background: linear-gradient(#5fd3a0, #2fb47c); box-shadow: 0 6px 0 #1d8a5b, 0 10px 18px #1d8a5b33;
}
#play:active { transform: translateY(4px); box-shadow: 0 2px 0 #1d8a5b; }
</style>
</head>
<body>
<canvas id="cv" aria-label="لوحة اللعب"></canvas>

<header id="top">
  <div class="side">
    <button class="round" id="bBack" aria-label="ارجع لبداية الدورة">
      <svg viewBox="0 0 24 24"><path d="M5.2 13.5A7 7 0 1 0 7.5 6.8"/><path class="f" d="M3.2 4.6 4.4 11l5.8-3z"/></svg>
    </button>
    <button class="round" id="bSound" aria-label="الصوت">
      <svg viewBox="0 0 24 24"><path class="f" d="M3.5 9h3.8L12.5 4.8v14.4L7.3 15H3.5z"/><path class="w" d="M16 9a4 4 0 0 1 0 6M18.6 6.4a7.6 7.6 0 0 1 0 11.2"/><path class="x" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
    </button>
  </div>
  <div id="mid">
    <div id="level">مرحلة ١</div>
    <div id="steps"><svg viewBox="0 0 24 24"><path class="f" d="M8.5 3c2 0 3 2.2 3 4.6S10.2 12 8.6 12 5.5 10 5.5 7.6 6.5 3 8.5 3zM6.4 13.5h4.2c.3 2-.6 3.8-2.1 3.8s-2.3-1.8-2.1-3.8zM15.5 7c2 0 3 2.2 3 4.6s-1.3 4.4-2.9 4.4-3.1-2-3.1-4.4S13.5 7 15.5 7zM13.4 17.5h4.2c.3 2-.6 3.8-2.1 3.8s-2.3-1.8-2.1-3.8z"/></svg><span id="stepsN">٨</span></div>
  </div>
  <div class="side end"><div id="echoes" aria-label="الأطياف"></div></div>
</header>

<nav id="bar">
  <button class="big" id="bHelp" aria-label="مساعدة">
    <span class="badge" id="helpN">٢</span>
    <span class="ic" id="helpIc"></span><b id="helpLb">تلميح</b>
  </button>
  <button class="big" id="bUndo" aria-label="تراجع خطوة">
    <span class="ic"><svg viewBox="0 0 24 24"><path class="f" d="M10.5 3.5 3 9.5l7.5 6v-3.8h3.7a3.4 3.4 0 0 1 0 6.8H12v3.2h2.2a6.6 6.6 0 0 0 0-13.2h-3.7z"/></svg></span><b>تراجع</b>
  </button>
  <button class="big" id="bWait" aria-label="انتظر دورة">
    <span class="ic"><svg viewBox="0 0 24 24"><path d="M6 3h12M6 21h12"/><path class="f" d="M7.5 4.5h9c0 3.6-2.8 5.4-4.5 7.5-1.7-2.1-4.5-3.9-4.5-7.5zM12 13.4c1.3 1.6 3.8 3 4.3 6.1H7.7c.5-3.1 3-4.5 4.3-6.1z" opacity=".95"/></svg></span><b>انتظر</b>
  </button>
</nav>
<div id="tip" role="note"></div>
<div id="cheer" aria-live="polite"></div>
<div id="toast" role="status"></div>

<div id="title" tabindex="0" role="button" aria-label="ابدأ">
  <canvas id="tcv" width="360" height="360"></canvas>
  <h1>طيف</h1>
  <p>كل محاولة تترك طيفًا يعيد خطواتك… ويفتح لك الطريق</p>
  <button id="play">العب</button>
  <div class="by">عبودين قيمز</div>
</div>

<script>
// ===== صدى — pure game logic (no rendering) — v0.2 =====
// Door kinds:
//   hold    — open while someone stands on its plate
//   timed   — like hold, but stays open TIMER more ticks after the plate is left
//   inverse — open by default, CLOSED while someone stands on its plate
// Any door with someone standing inside it stays open.
(function (root) {
  const DIRS = { U: [0, 1], D: [0, -1], L: [-1, 0], R: [1, 0], W: [0, 0] };
  const MOVES = ['U', 'D', 'L', 'R'];
  const TIMER = 3;

  function rng(seed) {
    let s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const clampI = (v, a, b) => Math.max(a, Math.min(b, v));
  const ri = (r, a, b) => a + Math.floor(r() * (b - a + 1));
  const pick = (r, arr) => arr[Math.floor(r() * arr.length)];
  const idx = (room, x, y) => y * room.W + x;
  const same = (a, b) => a.x === b.x && a.y === b.y;
  function doorAt(room, x, y) { for (let i = 0; i < room.doors.length; i++) if (room.doors[i].x === x && room.doors[i].y === y) return i; return -1; }

  // positions arrays carry .timers (one per door, 0 for non-timed)
  function withTimers(pos, timers) { pos.timers = timers; return pos; }
  function plateOn(room, pos, door) {
    return room.plates.some(p => p.door === door && (pos.some(e => e.x === p.x && e.y === p.y) || (room.pinned || []).some(e => e.x === p.x && e.y === p.y)));
  }

  function doorStates(room, pos) {
    const timers = pos.timers || [];
    return room.doors.map((d, i) => {
      const on = plateOn(room, pos, i);
      let open = d.kind === 'inverse' ? !on : (on || (d.kind === 'timed' && (timers[i] || 0) > 0));
      if (pos.some(e => e.x === d.x && e.y === d.y)) open = true;
      return open;
    });
  }

  function step(room, pos, actions) {
    const open = doorStates(room, pos);
    const next = pos.map((e, i) => {
      const d = DIRS[actions[i] || 'W'];
      const moving = !!(d[0] || d[1]);
      const nx = e.x + d[0], ny = e.y + d[1];
      if (nx < 0 || ny < 0 || nx >= room.W || ny >= room.H) return { x: e.x, y: e.y, blocked: moving };
      if (room.wall[idx(room, nx, ny)]) return { x: e.x, y: e.y, blocked: moving };
      const di = doorAt(room, nx, ny);
      if (di >= 0 && !open[di] && !(e.x === nx && e.y === ny)) return { x: e.x, y: e.y, blocked: true };
      return { x: nx, y: ny, blocked: false };
    });
    const t0 = pos.timers || [];
    return withTimers(next, room.doors.map((d, i) => d.kind !== 'timed' ? 0 : plateOn(room, pos, i) ? TIMER : Math.max(0, (t0[i] || 0) - 1)));
  }

  function startPos(room, n) { return withTimers(Array.from({ length: n }, () => ({ ...room.start })), room.doors.map(() => 0)); }

  // states[t] = positions (echoes..., player) after t ticks
  function run(room, echoes, player) {
    let pos = startPos(room, echoes.length + 1);
    const states = [pos];
    for (let t = 0; t < player.length; t++) {
      pos = step(room, pos, echoes.map(e => e[t] || 'W').concat([player[t]]));
      states.push(pos);
    }
    return states;
  }

  function bfsPath(room, from, to, doorsPassable) {
    const W = room.W, H = room.H, prev = new Int32Array(W * H).fill(-2);
    const q = [idx(room, from.x, from.y)]; prev[q[0]] = -1;
    let head = 0;
    while (head < q.length) {
      const c = q[head++]; const cx = c % W, cy = (c / W) | 0;
      if (cx === to.x && cy === to.y) {
        const path = []; let k = c;
        while (k !== -1) { path.push({ x: k % W, y: (k / W) | 0 }); k = prev[k]; }
        return path.reverse();
      }
      for (const m of MOVES) {
        const nx = cx + DIRS[m][0], ny = cy + DIRS[m][1];
        if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
        const n = idx(room, nx, ny);
        if (prev[n] !== -2 || room.wall[n]) continue;
        if (!doorsPassable) { const di = doorAt(room, nx, ny); if (di >= 0 && room.doors[di].kind !== 'inverse') continue; }
        prev[n] = c; q.push(n);
      }
    }
    return null;
  }

  // walk to each target in turn (shortest paths), waiting whenever the next step is blocked;
  // waits[k] extra ticks are spent standing on intermediate target k
  function routeMulti(room, echoes, targets, waits = []) {
    const acts = []; let from = { ...room.start };
    for (let k = 0; k < targets.length; k++) {
      const path = bfsPath(room, from, targets[k], true);
      if (!path) return null;
      let pi = 0, guard = 0;
      while (pi < path.length - 1 && guard++ < 40) {
        const states = run(room, echoes, acts);
        const pos = states[states.length - 1];
        const me = pos[pos.length - 1];
        const nxt = path[pi + 1];
        const m = MOVES.find(mm => me.x + DIRS[mm][0] === nxt.x && me.y + DIRS[mm][1] === nxt.y);
        const after = step(room, pos, echoes.map(e => e[acts.length] || 'W').concat([m]));
        if (same(after[after.length - 1], nxt)) { acts.push(m); pi++; } else acts.push('W');
      }
      if (pi !== path.length - 1) return null;
      if (k < targets.length - 1) for (let w = 0; w < (waits[k] || 0); w++) acts.push('W');
      from = targets[k];
    }
    return acts;
  }

  const plateOf = (room, door) => room.plates.find(p => p.door === door);

  // tasks: [[doorIdx, ...], ...] — one echo per task, pressing its doors' plates in order.
  // playerFirst: door indices whose plates the player presses on the way (timed doors only).
  function solveTasks(room, tasks, playerFirst = []) {
    const relay = tasks.map((t, i) => t.length > 1 ? i : -1).filter(i => i >= 0);
    const combos = relay.length ? cartesian(relay.map(() => [0, 1, 2, 3, 4, 5])) : [[]];
    for (const combo of combos) {
      const echoes = []; let ok = true;
      for (let j = 0; j < tasks.length; j++) {
        const waits = relay.includes(j) ? Array(tasks[j].length - 1).fill(combo[relay.indexOf(j)]) : [];
        const a = routeMulti(room, echoes, tasks[j].map(di => plateOf(room, di)), waits);
        if (!a) { ok = false; break; }
        echoes.push(a);
      }
      if (!ok) continue;
      for (const pw of [0, 1, 2]) {
        const targets = playerFirst.map(di => plateOf(room, di)).concat([room.exit]);
        const player = routeMulti(room, echoes, targets, playerFirst.map(() => pw));
        if (player && reaches(room, echoes, player)) return { echoes, player };
      }
    }
    return null;
  }
  function cartesian(lists) { return lists.reduce((acc, l) => acc.flatMap(a => l.map(x => a.concat([x]))), [[]]); }
  function reaches(room, echoes, player) {
    const L = Math.max(player.length, ...echoes.map(e => e.length), 0);
    const st = run(room, echoes.map(e => pad(e, L)), player);
    return same(st[st.length - 1][echoes.length], room.exit);
  }

  // exact check: can the player alone reach the exit within L ticks? (BFS over position + door timers)
  function aloneSolvable(room, L) {
    const start = startPos(room, 1);
    const key = p => p[0].x + ',' + p[0].y + '|' + p.timers.join('');
    let frontier = [start]; const seen = new Set([key(start)]);
    for (let t = 0; t < L; t++) {
      const nextF = [];
      for (const p of frontier) for (const a of ['U', 'D', 'L', 'R', 'W']) {
        const n = step(room, p, [a]);
        if (a !== 'W' && n[0].blocked) continue;
        if (same(n[0], room.exit)) return true;
        const k = key(n); if (!seen.has(k)) { seen.add(k); nextF.push(n); }
      }
      frontier = nextF;
    }
    return false;
  }

  function regionConnected(room, cells) {
    const set = new Set(cells.filter(([x, y]) => !room.wall[idx(room, x, y)]).map(([x, y]) => x + ',' + y));
    if (!set.size) return false;
    const first = set.values().next().value; const seen = new Set([first]); const q = [first];
    while (q.length) {
      const [x, y] = q.pop().split(',').map(Number);
      for (const m of MOVES) { const k = (x + DIRS[m][0]) + ',' + (y + DIRS[m][1]); if (set.has(k) && !seen.has(k)) { seen.add(k); q.push(k); } }
    }
    return seen.size === set.size;
  }

  // ---------- generator ----------
  function difficulty(level) {
    const k = level <= 2 ? 2 : level <= 8 ? 2 + (level % 2) : level <= 18 ? 3 : 3 + (level % 3 === 0 ? 1 : 0);
    return {
      k,
      W: level <= 3 ? 4 : level < 10 ? 5 : 6,
      deep: Math.min(0.6, 0.1 + level * 0.04),
      obst: Math.min(0.2, 0.05 + level * 0.01),
      slack: Math.max(1, 2 - Math.floor(level / 8)),
      tall: Math.min(0.6, 0.2 + level * 0.02),
      pTimed: level < 2 ? 0 : Math.min(0.6, 0.3 + level * 0.03),
      pInverse: level < 4 ? 0 : Math.min(0.4, 0.15 + level * 0.015),
      allowFull: level <= 1 ? 0.3 : 0.12, // chance to keep a room that needs one echo per gate
    };
  }

  // all ways to split n ordered gates into e contiguous groups
  function compositions(n, e) {
    const out = [];
    (function rec(startI, left, acc) {
      if (left === 1) { out.push(acc.concat([n - startI])); return; }
      for (let size = 1; size <= n - startI - (left - 1); size++) rec(startI + size, left - 1, acc.concat([size]));
    })(0, e, []);
    return out;
  }

  // fewest echoes that solve the room, by chaining consecutive gates onto one echo
  function minimalTasks(room) {
    const gates = room.doors.map((d, i) => i).filter(i => room.doors[i].kind !== 'inverse');
    for (let e = 1; e <= gates.length; e++) {
      for (const comp of compositions(gates.length, e)) {
        const tasks = []; let at = 0;

$('bBack').onclick = () => { audioStart(); SFX.tap(); backLoop(); };
$('bHelp').onclick = () => { audioStart(); SFX.tap(); pressHelp(); };
$('bSound').onclick = () => { audioStart(); setMuted(!S.muted); };
function begin() {
  if (S.started) return;
  S.started = true; audioStart();
  const t = $('title'); t.style.transition = 'opacity .5s'; t.style.opacity = 0; setTimeout(() => (t.hidden = true), 500);
  if (S.R.tutorial && !S.demoSeen[S.n]) { S.demoSeen[S.n] = 1; save(); setTimeout(() => startDemo(true), 700); }
}
$('title').addEventListener('pointerup', begin);
$('title').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') begin(); });

// ---------------- frame ----------------
const tcv = $('tcv'), tctx = tcv.getContext('2d');
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; const T = now / 1000;
  ents.forEach(e => updEnt(e, dt));
  doorFx.forEach(f => { f.open += ((f.target || 0) - f.open) * Math.min(1, dt * 10); f.flash = Math.max(0, f.flash - dt * 2.5); });
  plateFx.forEach((f, j) => { f.on += ((f.target || 0) - f.on) * Math.min(1, dt * 14); f.hover = hover >= 0 && S.R.plates[j].door === hover; });
  const heroE = ents[ents.length - 1];
  S.nearExit = heroE ? clamp(1 - (Math.hypot(heroE.x - S.R.exit.x, heroE.y - S.R.exit.y) - 1) / 3, 0, 1) : 0;
  music(dt);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.globalAlpha = 1;
  drawBg();
  const glow = ctx.createRadialGradient(VW / 2, VH * .45, 0, VW / 2, VH * .45, Math.max(VW, VH) * .7);
  glow.addColorStop(0, 'rgba(255,255,255,.55)'); glow.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = glow; ctx.fillRect(0, 0, VW, VH);

  // room enter / leave: the board pops in and shrinks away
  const ent = clamp((now - (S.enterT || 0)) / 450, 0, 1), out = S.transT ? clamp((now - S.transT) / 380, 0, 1) : 0;
  const sc = (.9 + .1 * easeOutBack(ent)) * (1 - .12 * ease(out)), al = Math.min(ent * 1.5, 1) * (1 - out);
  const cx = B.ox + S.R.W * B.s / 2, cy = B.oy + S.R.H * B.s / 2;
  ctx.save(); ctx.globalAlpha = al;
  ctx.setTransform(DPR * sc, 0, 0, DPR * sc, DPR * (cx - cx * sc), DPR * (cy - cy * sc));
  drawBoard(T);
  S.R.plates.forEach((p, j) => drawPlate(j, T));
  drawExit(T);
  S.R.doors.forEach((d, i) => drawDoor(i, T));
  drawTopScaled(sc, cx, cy);   // the raised white layer, under the same pop-in scale
  drawHint(T);
  drawPinned(T);
  [...ents].sort((a, b) => b.y - a.y).forEach(e => drawEnt(e, T));
  drawLink(T);
  ctx.restore();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.globalAlpha = 1;
  drawParts(dt);
  if (S.rewindK) { ctx.fillStyle = `rgba(124,198,255,${Math.sin(S.rewindK * Math.PI) * .16})`; ctx.fillRect(0, 0, VW, VH); }

  if (!$('title').hidden) {   // the hero waves on the title screen
    tctx.setTransform(1, 0, 0, 1, 0, 0); tctx.clearRect(0, 0, 360, 360);
    const b = Math.abs(Math.sin(T * 2.2));
    drawBlob(tctx, 180, 215 - b * 18, 110, { col: COL.hero, dk: COL.heroDk, T, face: 'D', expr: b > .9 ? 'happy' : 'calm', blink: (T % 3.3) < .13, squash: (1 - b) * .08, seed: 0 });
    drawBlob(tctx, 70, 260, 50, { col: COL.echo, dk: COL.echoDk, sprout: '#d6f0ff', alpha: .9, ghost: true, T, face: 'D', sleep: true, seed: 2 });
    drawBlob(tctx, 295, 268, 44, { col: COL.echo, dk: COL.echoDk, sprout: '#d6f0ff', alpha: .9, ghost: true, T, face: 'D', sleep: true, seed: 4 });
  }
  requestAnimationFrame(frame);
}
let bgLayer = null;
function drawBg() {
  if (!bgLayer || bgLayer.width !== cv.width || bgLayer.height !== cv.height) {
    const c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height;
    const g = c.getContext('2d'); g.setTransform(DPR, 0, 0, DPR, 0, 0);
    const lg = g.createLinearGradient(0, 0, 0, VH); lg.addColorStop(0, '#e6ecf4'); lg.addColorStop(1, '#d5dde9');
    g.fillStyle = lg; g.fillRect(0, 0, VW, VH);
    // tiny scattered sparkles and rings, very faint
    let sd = 7; const rnd = () => ((sd = (sd * 16807) % 2147483647) / 2147483647);
    for (let y = 0; y < VH + 40; y += 46) for (let x = (y / 46 % 2) * 23; x < VW + 40; x += 46) {
      const k = rnd(); g.save(); g.translate(x, y); g.rotate(rnd() * 3);
      if (k < .5) { g.fillStyle = 'rgba(255,255,255,.55)'; g.beginPath(); g.arc(0, 0, 2.2, 0, Math.PI * 2); g.fill(); }
      else if (k < .75) { g.strokeStyle = 'rgba(140,160,190,.16)'; g.lineWidth = 2; g.beginPath(); g.arc(0, 0, 5, 0, Math.PI * 2); g.stroke(); }
      else { g.strokeStyle = 'rgba(140,160,190,.14)'; g.lineWidth = 2; g.lineCap = 'round'; g.beginPath(); g.moveTo(-4, 0); g.lineTo(4, 0); g.moveTo(0, -4); g.lineTo(0, 4); g.stroke(); }
      g.restore();
    }
    bgLayer = c;
  }
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(bgLayer, 0, 0); ctx.restore();
}
function drawTopScaled(sc, cx, cy) {
  if (!topLayer) buildTop();
  ctx.save();
  ctx.setTransform(sc, 0, 0, sc, DPR * (cx - cx * sc), DPR * (cy - cy * sc));
  ctx.shadowColor = 'rgba(40,52,78,.28)'; ctx.shadowBlur = B.s * .14 * DPR * sc; ctx.shadowOffsetY = B.s * .07 * DPR * sc;
  ctx.drawImage(topLayer, 0, 0);
  ctx.restore();
}

// test hooks (used by the automated play test; harmless for players)
window.__heroBox = () => { const e = ents[ents.length - 1], p = scr(e.x, e.y), h = B.s * 1.3; return { x: Math.max(0, p[0] - h / 2), y: Math.max(0, p[1] - h * .85), width: h, height: h }; };
window.__sada = { S, doAction, loadRoom, cur, get ents() { return ents; }, startDemo, showHint, pressHelp, setExpr, layout };

load();
window.addEventListener('resize', resize);
$('bSound').classList.toggle('off', S.muted);
loadRoom(S.n); resize(); ui();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { layout(); });
requestAnimationFrame(frame);
})();

</script>
