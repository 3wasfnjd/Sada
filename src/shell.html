<title>صدى</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@600;700&family=Readex+Pro:wght@400;600&display=swap">
<style>
/* Layout: full-screen portrait app — thin HUD on top, 3D stage, timeline + action bar at the thumb. Deliberate single night theme. */
:root{
  --night:#0d0f22; --dusk:#221d45; --plum:#3b2c5c;
  --ink:#f3e9d8; --mute:#a59cc4;
  --brass:#f2b25c; --echo:#8fd8ff; --danger:#ff7a6b;
  --display:"Reem Kufi","Readex Pro",system-ui,sans-serif;
  --ui:"Readex Pro",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--ui);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
@media (min-width:600px){#app{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
header{display:flex;align-items:center;gap:10px;padding-block:10px 4px}
.chip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);border-radius:999px;padding:6px 12px;font-variant-numeric:tabular-nums;font-size:.95rem}
.chip svg{width:18px;height:18px}
#room{font-family:var(--display);font-size:1.15rem;background:none;padding-inline:4px}
.sp{flex:1}
.iconbtn{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.06);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:20px;height:20px}
#sand.low{color:var(--danger);animation:throb .7s infinite alternate}
@keyframes throb{to{opacity:.5}}
#stage{position:relative;flex:1;min-height:0;border-radius:18px;overflow:hidden;
  background:radial-gradient(120% 80% at 50% 0%,#3a2f6b 0%,#1b1838 55%,#0d0f22 100%)}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:radial-gradient(1px 1px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 78% 9%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 64% 26%,#ffe9c2 50%,transparent 51%),radial-gradient(1px 1px at 33% 7%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 90% 31%,#cfe8ff 50%,transparent 51%),radial-gradient(1px 1px at 22% 36%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 48% 14%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 6% 44%,#fff 50%,transparent 51%)}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#tint{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;
  background:radial-gradient(circle at 50% 50%,rgba(143,216,255,.05),rgba(60,120,255,.35));mix-blend-mode:screen}
#stage.rewinding #tint{opacity:1}
#stage.rewinding canvas{filter:saturate(.35) hue-rotate(160deg) brightness(1.1)}
#flash{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0}
#finger{position:absolute;width:46px;height:46px;pointer-events:none;opacity:0;transition:opacity .3s}
#finger.on{opacity:.9;animation:tap 1.2s infinite}
@keyframes tap{0%,100%{transform:translate(-50%,-30%) scale(1)}50%{transform:translate(-50%,-30%) scale(.82)}}
footer{padding-block:8px max(10px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.tl{display:flex;align-items:center;gap:10px}
#ticks{flex:1;display:flex;gap:3px;height:12px;direction:ltr}
#ticks i{flex:1;border-radius:3px;background:rgba(255,255,255,.1);transition:background .15s}
#ticks i.done{background:var(--brass)}
#ticks.warn i:not(.done){background:rgba(255,122,107,.45)}
#left{font-family:var(--display);font-size:1.4rem;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
#left.warn{color:var(--danger)}
.bar{display:grid;grid-template-columns:repeat(4,52px) 1fr;gap:8px;align-items:stretch}
.bar button{border:0;border-radius:14px;background:rgba(255,255,255,.07);color:var(--ink);cursor:pointer;display:grid;place-items:center;min-height:52px;font:inherit}
.bar button svg{width:24px;height:24px}
.bar button:disabled{opacity:.3}
#echo{background:linear-gradient(135deg,#6fc8ff,#8f7bff);color:#0d0f22;font-family:var(--display);font-size:1.3rem;display:flex;gap:10px;align-items:center;justify-content:center}
#echo svg{width:26px;height:26px}
#echo.pulse{animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(143,216,255,.7)}100%{box-shadow:0 0 0 14px rgba(143,216,255,0)}}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(100% 70% at 50% 30%,rgba(59,44,92,.92),rgba(13,15,34,.97));
  padding:calc(20px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.card{max-width:360px;width:100%;text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center}
.card h1{font-family:var(--display);font-size:5.2rem;line-height:1;margin:0;font-weight:700;
  background:linear-gradient(180deg,#fff3dc,#f2b25c);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 40px rgba(242,178,92,.25)}
.card h1 span{display:block;font-size:.32em;letter-spacing:.3em;color:var(--echo);-webkit-text-fill-color:var(--echo);opacity:.8;margin-top:6px}
.card h2{font-family:var(--display);font-size:2rem;margin:0}
.card p{margin:0;color:var(--mute);line-height:1.7;max-width:30ch}
.big{border:0;border-radius:16px;padding:14px 44px;font-family:var(--display);font-size:1.4rem;cursor:pointer;
  background:linear-gradient(135deg,#ffd38a,#f2a14b);color:#2a1a08}
.stats{display:flex;gap:28px;justify-content:center}
.stats b{display:block;font-family:var(--display);font-size:2rem;font-variant-numeric:tabular-nums}
.stats span{color:var(--mute);font-size:.8rem}
.brand{font-size:.72rem;color:var(--mute);letter-spacing:.08em;opacity:.7}
#toast{position:absolute;top:14px;left:50%;transform:translate(-50%,-8px);padding:8px 16px;border-radius:999px;
  background:rgba(13,15,34,.75);font-family:var(--display);font-size:1.05rem;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#finger.on,#echo.pulse,#sand.low{animation:none}}
</style>

<div id="app" dir="rtl">
  <header>
    <div class="chip" id="room">غرفة ١</div>
    <div class="sp"></div>
    <div class="chip" id="echoes" title="الأصداء"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.2"/><path d="M6 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><path d="M3 12a9 9 0 0 1 2-5.6M21 12a9 9 0 0 0-2-5.6" opacity=".55"/></svg><span id="echoN">٠</span></div>
    <div class="chip" id="sand" title="رمل الساعة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 3h12M6 21h12M7 3c0 5 10 5 10 9s-10 4-10 9M17 3c0 5-10 5-10 9s10 4 10 9"/></svg><span id="sandN">٦</span></div>
    <button class="iconbtn" id="mute" aria-label="الصوت"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path id="waves" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg></button>
  </header>
  <div id="stage">
    <div id="tint"></div><div id="flash"></div>
    <svg id="finger" viewBox="0 0 48 48"><circle cx="24" cy="18" r="14" fill="none" stroke="#fff" stroke-width="2.5" opacity=".7"/><circle cx="24" cy="18" r="6" fill="#fff"/></svg>
    <div id="toast"></div>
  </div>
  <footer>
    <div class="tl"><div id="ticks"></div><div id="left">٠</div></div>
    <div class="bar">
      <button id="restart" aria-label="أعد الغرفة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
      <button id="hint" aria-label="تلميح"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 1 3.5 10.9c-.6.5-1 1.2-1 2.1H9.5c0-.9-.4-1.6-1-2.1A6 6 0 0 1 12 3z"/></svg></button>
      <button id="undo" aria-label="تراجع خطوة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button id="wait" aria-label="انتظر لحظة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg></button>
      <button id="echo" aria-label="أطلق صدى"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>صدى</button>
    </div>
  </footer>
</div>

<div class="overlay" id="startScreen">
  <div class="card">
    <h1>صدى<span>ECHO</span></h1>
    <p>كل ما تفعله الآن، ستفعله نسخة منك في الجولة القادمة. استعن بأصدائك لتفتح الأبواب.</p>
    <div class="stats"><div><b id="bestStart">٠</b><span>أبعد غرفة</span></div></div>
    <button class="big" id="go">ابدأ</button>
    <div class="brand">عبودين قيمز · ABODEN GAMES · v0.2.0</div>
  </div>
</div>
<div class="overlay" id="overScreen" hidden>
  <div class="card">
    <h2>انقطع الصدى</h2>
    <p>نفد رمل الساعة.</p>
    <div class="stats"><div><b id="overRooms">٠</b><span>غرف عبرتها</span></div><div><b id="overBest">٠</b><span>أبعد غرفة</span></div></div>
    <button class="big" id="again">رحلة جديدة</button>
  </div>
</div>

<script>/*LOGIC*/</script>
<script type="module">/*GAME*/</script>
