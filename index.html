<style>
/* Layout: full-screen portrait app — thin HUD on top, 3D stage, timeline + action bar at the thumb. Deliberate single night theme. */
:root{
  --night:#0d0f22; --dusk:#221d45; --plum:#3b2c5c;
  --ink:#f3e9d8; --mute:#a59cc4;
  --brass:#f2b25c; --echo:#8fd8ff; --danger:#ff7a6b;
  --display:"Reem Kufi","Readex Pro",system-ui,sans-serif;
  --ui:"Readex Pro",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--ui);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
@media (min-width:600px){#app{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
header{display:flex;align-items:center;gap:10px;padding-block:10px 4px}
.chip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);border-radius:999px;padding:6px 12px;font-variant-numeric:tabular-nums;font-size:.95rem}
.chip svg{width:18px;height:18px}
#room{font-family:var(--display);font-size:1.15rem;background:none;padding-inline:4px}
.sp{flex:1}
.iconbtn{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.06);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:20px;height:20px}
.iconbtn.on{background:var(--echo);color:#0d0f22}
#stage.demo::after{content:"▶ ▶";position:absolute;top:12px;right:12px;padding:4px 12px;border-radius:999px;background:rgba(143,216,255,.85);color:#0d0f22;font-family:var(--display);font-size:.95rem;pointer-events:none}
#helpChip.none{opacity:.45}
@keyframes throb{to{opacity:.5}}
#stage{position:relative;flex:1;min-height:0;border-radius:18px;overflow:hidden;
  background:radial-gradient(120% 80% at 50% 0%,#3a2f6b 0%,#1b1838 55%,#0d0f22 100%)}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:radial-gradient(1px 1px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 78% 9%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 64% 26%,#ffe9c2 50%,transparent 51%),radial-gradient(1px 1px at 33% 7%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 90% 31%,#cfe8ff 50%,transparent 51%),radial-gradient(1px 1px at 22% 36%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 48% 14%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 6% 44%,#fff 50%,transparent 51%)}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#tint{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;
  background:radial-gradient(circle at 50% 50%,rgba(143,216,255,.05),rgba(60,120,255,.35));mix-blend-mode:screen}
#stage.rewinding #tint{opacity:1}
#stage.rewinding canvas{filter:saturate(.35) hue-rotate(160deg) brightness(1.1)}
#flash{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0}
#finger{position:absolute;width:46px;height:46px;pointer-events:none;opacity:0;transition:opacity .3s}
#finger.on{opacity:.9;animation:tap 1.2s infinite}
@keyframes tap{0%,100%{transform:translate(-50%,-30%) scale(1)}50%{transform:translate(-50%,-30%) scale(.82)}}
footer{padding-block:8px max(10px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.tl{display:flex;align-items:center;gap:10px}
#ticks{flex:1;display:flex;gap:3px;height:12px;direction:ltr}
#ticks i{flex:1;border-radius:3px;background:rgba(255,255,255,.1);transition:background .15s}
#ticks i.done{background:var(--brass)}
#ticks.warn i:not(.done){background:rgba(255,122,107,.45)}
#left{font-family:var(--display);font-size:1.4rem;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
#left.warn{color:var(--danger)}
.bar{display:grid;grid-template-columns:repeat(5,minmax(40px,48px)) 1fr;gap:6px;align-items:stretch}
.bar button{border:0;border-radius:14px;background:rgba(255,255,255,.07);color:var(--ink);cursor:pointer;display:grid;place-items:center;min-height:52px;font:inherit}
.bar button svg{width:24px;height:24px}
.bar button:disabled{opacity:.3}
#wait{background:linear-gradient(135deg,#6fc8ff,#8f7bff);color:#0d0f22;font-family:var(--display);font-size:1.2rem;display:flex;gap:8px;align-items:center;justify-content:center}
#wait svg{width:24px;height:24px}
.bar button.pulse{animation:pulse 1s infinite}
.bar button.armed{background:#f2b25c;color:#2a1a08}
.tlw{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
#doorWin{display:flex;flex-direction:column;gap:2px}
#doorWin div{display:flex;gap:3px;height:4px;direction:ltr}
#doorWin i{flex:1;border-radius:2px;background:rgba(255,255,255,.05)}
#loopChip{font-variant-numeric:tabular-nums}
#loopChip.final{color:var(--brass)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(143,216,255,.7)}100%{box-shadow:0 0 0 14px rgba(143,216,255,0)}}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(100% 70% at 50% 30%,rgba(59,44,92,.92),rgba(13,15,34,.97));
  padding:calc(20px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.card{max-width:360px;width:100%;text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center}
.card h1{font-family:var(--display);font-size:5.2rem;line-height:1;margin:0;font-weight:700;
  background:linear-gradient(180deg,#fff3dc,#f2b25c);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 40px rgba(242,178,92,.25)}
.card h1 span{display:block;font-size:.32em;letter-spacing:.3em;color:var(--echo);-webkit-text-fill-color:var(--echo);opacity:.8;margin-top:6px}
.card h2{font-family:var(--display);font-size:2rem;margin:0}
.card p{margin:0;color:var(--mute);line-height:1.7;max-width:30ch}
.big{border:0;border-radius:16px;padding:14px 44px;font-family:var(--display);font-size:1.4rem;cursor:pointer;
  background:linear-gradient(135deg,#ffd38a,#f2a14b);color:#2a1a08}
.stats{display:flex;gap:28px;justify-content:center}
.stats b{display:block;font-family:var(--display);font-size:2rem;font-variant-numeric:tabular-nums}
.stats span{color:var(--mute);font-size:.8rem}
.brand{font-size:.72rem;color:var(--mute);letter-spacing:.08em;opacity:.7}
#toast{position:absolute;top:14px;left:50%;transform:translate(-50%,-8px);padding:8px 16px;border-radius:999px;
  background:rgba(13,15,34,.75);font-family:var(--display);font-size:1.05rem;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#finger.on,.bar button.pulse{animation:none}}
</style>

<script>// ===== صدى — pure game logic (no rendering) — v0.2 =====
// Door kinds:
//   hold    — open while someone stands on its plate
//   timed   — like hold, but stays open TIMER more ticks after the plate is left
//   inverse — open by default, CLOSED while someone stands on its plate
// Any door with someone standing inside it stays open.
(function (root) {
  const DIRS = { U: [0, 1], D: [0, -1], L: [-1, 0], R: [1, 0], W: [0, 0] };
  const MOVES = ['U', 'D', 'L', 'R'];
  const TIMER = 3;

  function rng(seed) {
    let s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const clampI = (v, a, b) => Math.max(a, Math.min(b, v));
  const ri = (r, a, b) => a + Math.floor(r() * (b - a + 1));
  const pick = (r, arr) => arr[Math.floor(r() * arr.length)];
  const idx = (room, x, y) => y * room.W + x;
  const same = (a, b) => a.x === b.x && a.y === b.y;
  function doorAt(room, x, y) { for (let i = 0; i < room.doors.length; i++) if (room.doors[i].x === x && room.doors[i].y === y) return i; return -1; }

  // positions arrays carry .timers (one per door, 0 for non-timed)
  function withTimers(pos, timers) { pos.timers = timers; return pos; }
  function plateOn(room, pos, door) {
    return room.plates.some(p => p.door === door && (pos.some(e => e.x === p.x && e.y === p.y) || (room.pinned || []).some(e => e.x === p.x && e.y === p.y)));
  }

  function doorStates(room, pos) {
    const timers = pos.timers || [];
    return room.doors.map((d, i) => {
      const on = plateOn(room, pos, i);
      let open = d.kind === 'inverse' ? !on : (on || (d.kind === 'timed' && (timers[i] || 0) > 0));
      if (pos.some(e => e.x === d.x && e.y === d.y)) open = true;
      return open;
    });
  }

  function step(room, pos, actions) {
    const open = doorStates(room, pos);
    const next = pos.map((e, i) => {
      const d = DIRS[actions[i] || 'W'];
      const moving = !!(d[0] || d[1]);
      const nx = e.x + d[0], ny = e.y + d[1];
      if (nx < 0 || ny < 0 || nx >= room.W || ny >= room.H) return { x: e.x, y: e.y, blocked: moving };
      if (room.wall[idx(room, nx, ny)]) return { x: e.x, y: e.y, blocked: moving };
      const di = doorAt(room, nx, ny);
      if (di >= 0 && !open[di] && !(e.x === nx && e.y === ny)) return { x: e.x, y: e.y, blocked: true };
      return { x: nx, y: ny, blocked: false };
    });
    const t0 = pos.timers || [];
    return withTimers(next, room.doors.map((d, i) => d.kind !== 'timed' ? 0 : plateOn(room, pos, i) ? TIMER : Math.max(0, (t0[i] || 0) - 1)));
  }

  function startPos(room, n) { return withTimers(Array.from({ length: n }, () => ({ ...room.start })), room.doors.map(() => 0)); }

  // states[t] = positions (echoes..., player) after t ticks
  function run(room, echoes, player) {
    let pos = startPos(room, echoes.length + 1);
    const states = [pos];
    for (let t = 0; t < player.length; t++) {
      pos = step(room, pos, echoes.map(e => e[t] || 'W').concat([player[t]]));
      states.push(pos);
    }
    return states;
  }

  function bfsPath(room, from, to, doorsPassable) {
    const W = room.W, H = room.H, prev = new Int32Array(W * H).fill(-2);
    const q = [idx(room, from.x, from.y)]; prev[q[0]] = -1;
    let head = 0;
    while (head < q.length) {
      const c = q[head++]; const cx = c % W, cy = (c / W) | 0;
      if (cx === to.x && cy === to.y) {
        const path = []; let k = c;
        while (k !== -1) { path.push({ x: k % W, y: (k / W) | 0 }); k = prev[k]; }
        return path.reverse();
      }
      for (const m of MOVES) {
        const nx = cx + DIRS[m][0], ny = cy + DIRS[m][1];
        if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
        const n = idx(room, nx, ny);
        if (prev[n] !== -2 || room.wall[n]) continue;
        if (!doorsPassable) { const di = doorAt(room, nx, ny); if (di >= 0 && room.doors[di].kind !== 'inverse') continue; }
        prev[n] = c; q.push(n);
      }
    }
    return null;
  }

  // walk to each target in turn (shortest paths), waiting whenever the next step is blocked;
  // waits[k] extra ticks are spent standing on intermediate target k
  function routeMulti(room, echoes, targets, waits = []) {
    const acts = []; let from = { ...room.start };
    for (let k = 0; k < targets.length; k++) {
      const path = bfsPath(room, from, targets[k], true);
      if (!path) return null;
      let pi = 0, guard = 0;
      while (pi < path.length - 1 && guard++ < 40) {
        const states = run(room, echoes, acts);
        const pos = states[states.length - 1];
        const me = pos[pos.length - 1];
        const nxt = path[pi + 1];
        const m = MOVES.find(mm => me.x + DIRS[mm][0] === nxt.x && me.y + DIRS[mm][1] === nxt.y);
        const after = step(room, pos, echoes.map(e => e[acts.length] || 'W').concat([m]));
        if (same(after[after.length - 1], nxt)) { acts.push(m); pi++; } else acts.push('W');
      }
      if (pi !== path.length - 1) return null;
      if (k < targets.length - 1) for (let w = 0; w < (waits[k] || 0); w++) acts.push('W');
      from = targets[k];
    }
    return acts;
  }

  const plateOf = (room, door) => room.plates.find(p => p.door === door);

  // tasks: [[doorIdx, ...], ...] — one echo per task, pressing its doors' plates in order.
  // playerFirst: door indices whose plates the player presses on the way (timed doors only).
  function solveTasks(room, tasks, playerFirst = []) {
    const relay = tasks.map((t, i) => t.length > 1 ? i : -1).filter(i => i >= 0);
    const combos = relay.length ? cartesian(relay.map(() => [0, 1, 2, 3, 4, 5])) : [[]];
    for (const combo of combos) {
      const echoes = []; let ok = true;
      for (let j = 0; j < tasks.length; j++) {
        const waits = relay.includes(j) ? Array(tasks[j].length - 1).fill(combo[relay.indexOf(j)]) : [];
        const a = routeMulti(room, echoes, tasks[j].map(di => plateOf(room, di)), waits);
        if (!a) { ok = false; break; }
        echoes.push(a);
      }
      if (!ok) continue;
      for (const pw of [0, 1, 2]) {
        const targets = playerFirst.map(di => plateOf(room, di)).concat([room.exit]);
        const player = routeMulti(room, echoes, targets, playerFirst.map(() => pw));
        if (player && reaches(room, echoes, player)) return { echoes, player };
      }
    }
    return null;
  }
  function cartesian(lists) { return lists.reduce((acc, l) => acc.flatMap(a => l.map(x => a.concat([x]))), [[]]); }
  function reaches(room, echoes, player) {
    const L = Math.max(player.length, ...echoes.map(e => e.length), 0);
    const st = run(room, echoes.map(e => pad(e, L)), player);
    return same(st[st.length - 1][echoes.length], room.exit);
  }

  // exact check: can the player alone reach the exit within L ticks? (BFS over position + door timers)
  function aloneSolvable(room, L) {
    const start = startPos(room, 1);
    const key = p => p[0].x + ',' + p[0].y + '|' + p.timers.join('');
    let frontier = [start]; const seen = new Set([key(start)]);
    for (let t = 0; t < L; t++) {
      const nextF = [];
      for (const p of frontier) for (const a of ['U', 'D', 'L', 'R', 'W']) {
        const n = step(room, p, [a]);
        if (a !== 'W' && n[0].blocked) continue;
        if (same(n[0], room.exit)) return true;
        const k = key(n); if (!seen.has(k)) { seen.add(k); nextF.push(n); }
      }
      frontier = nextF;
    }
    return false;
  }

  function regionConnected(room, cells) {
    const set = new Set(cells.filter(([x, y]) => !room.wall[idx(room, x, y)]).map(([x, y]) => x + ',' + y));
    if (!set.size) return false;
    const first = set.values().next().value; const seen = new Set([first]); const q = [first];
    while (q.length) {
      const [x, y] = q.pop().split(',').map(Number);

  for (const e of S.ents.concat(S.statues)) {
    const a = e.anim;
    if (e.pop !== undefined) { e.pop = Math.min(1, e.pop + dt * 2.5); e.root.scale.setScalar(easeOutBack(e.pop)); if (e.pop >= 1) delete e.pop; }
    let sq = 1;
    if (a) {
      a.t += dt; const k = clamp(a.t / a.dur, 0, 1);
      if (a.kind === 'hop') { e.root.position.lerpVectors(a.from, a.to, k); e.root.position.y = Math.sin(k * Math.PI) * .26; sq = 1 + Math.sin(k * Math.PI) * .12; if (k >= 1) e.land = .12; }
      else if (a.kind === 'bump') { const b = Math.sin(k * Math.PI) * .18; e.root.position.copy(a.from); e.root.position.x += a.dir[0] * b; e.root.position.z -= a.dir[1] * b; }
      else if (a.kind === 'idle') { e.root.position.copy(a.to); sq = 1 - Math.sin(k * Math.PI) * .06; }
      else if (a.kind === 'drop') { e.root.position.y = 3 * (1 - k * k); if (k >= 1) { e.root.position.y = 0; e.land = .18; } }
      else if (a.kind === 'cheer') { e.root.position.y = Math.abs(Math.sin(k * Math.PI * 2)) * .45; e.tyaw += dt * 9; }
      else if (a.kind === 'leave') { e.root.position.y = k * k * 3; e.root.scale.setScalar(1 - k * .6); }
      if (k >= 1 && a.kind !== 'leave') e.anim = null;
    } else e.root.position.y = 0;
    if (e.land > 0) { e.land -= dt; sq = 1 - Math.sin((e.land / .15) * Math.PI) * .2; }
    if (e.model && !e.squash) sq = 1;
    e.inner.scale.set(1 / Math.sqrt(sq), sq * (1 + (e.model ? 0 : Math.sin(T * 2.4 + e.root.id) * .015)), 1 / Math.sqrt(sq));
    if (e.mixer) { e.play(a ? ({ hop: 'hop', bump: 'bump', cheer: 'cheer', drop: 'land' }[a.kind] || 'idle') : 'idle'); e.mixer.update(dt); }
    let dy = e.tyaw - e.yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy)); e.yaw += dy * Math.min(1, dt * 14); e.root.rotation.y = e.yaw;
    e.tail.rotation.x = Math.sin(T * 6 + e.root.id) * .25 + (a && a.kind === 'hop' ? -.6 : 0);
    e.blink -= dt; if (e.blink < 0) { e.eyes.scale.y = .1; if (e.blink < -.12) { e.eyes.scale.y = 1; e.blink = 2 + Math.random() * 4; } }
    if (e.ghost) e.mat.opacity = .45 + Math.sin(T * 3 + e.root.id) * .07;
  }
  for (const d of S.doors) {
    d.open += (d.target - d.open) * Math.min(1, dt * 10);
    d.g.position.y = -d.open * d.sink; d.seamMat.emissiveIntensity = 1.4 + d.open * 1.6 + Math.sin(T * 3) * .2;
    d.icon.rotation.y = T * 1.2; d.icon.position.y = 1.45 + Math.sin(T * 2) * .05; d.ig.material.opacity = .4 + d.open * .5;
    d.pips.forEach((m, k) => { const lit = k < d.timer; m.emissiveIntensity += ((lit ? 2.4 : .15) - m.emissiveIntensity) * Math.min(1, dt * 12); });
  }
  for (const p of S.plates) {
    p.press += (p.target - p.press) * Math.min(1, dt * 14);
    if (p.model) { p.base.position.y = -p.press * .025; const k = .55 + p.press * .9 + (1 - p.press) * Math.max(0, Math.sin(T * 3)) * .15; p.glowMats.forEach(m => m.color.setScalar(k)); }
    p.top.position.y = (p.model ? .115 : .1) - p.press * .025; p.topMat.emissiveIntensity = .5 + p.press * 2.5 + (1 - p.press) * Math.max(0, Math.sin(T * 3)) * .4;
    p.gl.material.opacity = .2 + p.press * .6;
  }
  if (S.exitObj) {
    const x = S.exitObj; x.ring.rotation.z = T * .8; x.beam.material.opacity = .45 + Math.sin(T * 2) * .1;
    const arr = x.motes.geometry.attributes.position; for (let i = 0; i < arr.count; i++) { let y = arr.getY(i) + dt * .5; if (y > 2.6) y = 0; arr.setY(i, y); } arr.needsUpdate = true;
  }
  if (hintT > 0) { hintT -= dt; feet.material.opacity = Math.min(.85, hintT) * (.6 + Math.sin(T * 6) * .25); if (hintT <= 0) { feet.count = 0; refreshNums(); } }
  fx = fx.filter(f => {
    f.t += dt; const k = f.t / f.dur;
    if (f.kind === 'ring') { f.obj.scale.setScalar((1 + k * 2.2) * f.s); f.obj.material.opacity = .9 * (1 - k); }
    else { const p = f.obj.geometry.attributes.position; f.vel.forEach((v, i) => { v[1] -= 6 * dt; p.setXYZ(i, p.getX(i) + v[0] * dt, Math.max(.02, p.getY(i) + v[1] * dt), p.getZ(i) + v[2] * dt); }); p.needsUpdate = true; f.obj.material.opacity = 1 - k; }
    if (k >= 1) { scene.remove(f.obj); f.obj.geometry !== G.ring && f.obj.geometry.dispose(); f.obj.material.dispose(); return false; }
    return true;
  });
  if (camera.userData.base) { camera.position.copy(camera.userData.base); camera.position.x += Math.sin(T * .25) * .25; camera.position.y += Math.sin(T * .31) * .12; camera.lookAt(camera.userData.target); }
  // onboarding finger follows the exit on screen
  const fg = $('finger');
  if (fg.classList.contains('on') && S.R) { const p = cellV(S.R.exit.x, S.R.exit.y, .2).project(camera); fg.style.left = ((p.x + 1) / 2 * stage.clientWidth) + 'px'; fg.style.top = ((1 - p.y) / 2 * stage.clientHeight) + 'px'; }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
fitCamera();
</script>
