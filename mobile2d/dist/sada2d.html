<title>صدى</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#151330">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Readex+Pro:wght@400;600&display=swap">
<style>
/* Layout: one screen, the paper diorama fills it; a thin icon rail at the bottom. Single night look by design. */
:root {
  --night: #151330;      /* the room's darkness, a blue-violet ink */
  --ink: #0d0c1f;
  --paper: #efe2c8;      /* cut paper */
  --lantern: #ffb547;    /* the hero's light */
  --echo: #8fd8ff;       /* memories */
  --mute: #8d86b8;
  --display: "Aref Ruqaa", "Amiri", "Noto Naskh Arabic", serif;
  --ui: "Readex Pro", "Noto Sans Arabic", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--night); color: var(--paper); font-family: var(--ui);
  overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#app { position: fixed; inset: 0; display: flex; flex-direction: column; }
#stage { position: relative; flex: 1; min-height: 0; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#top {
  position: absolute; top: 0; inset-inline: 0; display: flex; align-items: center; justify-content: space-between;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
  pointer-events: none; font-variant-numeric: tabular-nums;
}
#room { font-family: var(--display); font-size: 30px; line-height: 1; color: var(--paper); opacity: .9; }
#helps { display: flex; gap: 5px; align-items: center; }
#helps i { width: 9px; height: 9px; border-radius: 50%; background: var(--lantern); box-shadow: 0 0 8px var(--lantern); }
#helps i.off { background: transparent; box-shadow: none; outline: 1.5px solid #ffb54755; }
#rail {
  display: flex; justify-content: center; gap: 10px; flex-wrap: nowrap;
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 12px) max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(transparent, #0d0c1fcc 40%);
}
#rail button {
  width: 52px; height: 52px; border-radius: 16px; border: 1.5px solid #efe2c833; background: #1d1a40;
  color: var(--paper); display: grid; place-items: center; padding: 0; cursor: pointer; position: relative;
  transition: transform .12s, background .2s, border-color .2s;
}
#rail button:active { transform: scale(.92); }
#rail button:focus-visible { outline: 2px solid var(--lantern); outline-offset: 2px; }
#rail button svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#rail button.armed { background: #ffb54733; border-color: var(--lantern); color: var(--lantern); }
#rail button.pulse { animation: pulse 1.4s ease-in-out infinite; }
#rail button.dim { opacity: .35; }
@keyframes pulse { 50% { border-color: var(--lantern); box-shadow: 0 0 16px #ffb54766; } }
#title {
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center; background: radial-gradient(circle at 50% 42%, #2a2560 0%, var(--night) 62%);
  cursor: pointer; z-index: 5; padding-inline: max(16px, env(safe-area-inset-left, 0px));
}
#title h1 { font-family: var(--display); font-weight: 700; font-size: clamp(88px, 30vw, 160px); margin: 0; line-height: 1; color: var(--paper);
  text-shadow: 0 0 40px #ffb54755, 0 6px 0 #0d0c1f; }
#title h1 span { display: inline-block; animation: echo 3.2s ease-in-out infinite; color: var(--echo); opacity: 0; position: absolute; inset: 0; text-align: center; text-shadow: none; z-index: -1; }
@keyframes echo { 0% { opacity: 0; transform: translateX(0); } 40% { opacity: .35; } 100% { opacity: 0; transform: translateX(46px); } }
#title p { margin: 18px 0 0; font-size: 15px; color: var(--mute); letter-spacing: .02em; }
#title .wrap { position: relative; }
#title h1 { position: relative; }
#toast { position: absolute; left: 50%; top: 22%; transform: translate(-50%, 0); font-family: var(--display); font-size: 44px; color: var(--lantern);
  text-shadow: 0 0 20px #ffb54788; pointer-events: none; opacity: 0; transition: opacity .3s, transform .3s; }
#toast.on { opacity: 1; transform: translate(-50%, -8px); }
@media (prefers-reduced-motion: reduce) { #title h1 span { animation: none; } #rail button.pulse { animation: none; } }
</style>
<div id="app" dir="rtl">
  <div id="stage">
    <canvas id="cv" aria-label="لوح اللعب"></canvas>
    <div id="top"><div id="room">١</div><div id="helps" aria-label="المساعدات"></div></div>
    <div id="toast"></div>
    <div id="title" role="button" tabindex="0" aria-label="ابدأ">
      <div class="wrap"><h1>صدى<span aria-hidden="true">صدى</span></h1><p>المس للبدء</p></div>
    </div>
  </div>
  <nav id="rail" aria-label="أدوات">
    <button id="bWait" aria-label="انتظر خطوة"><svg viewBox="0 0 24 24"><path d="M7 3h10M7 21h10"/><path d="M8 3c0 5 8 5 8 9s-8 4-8 9M16 3c0 5-8 5-8 9s8 4 8 9"/></svg></button>
    <button id="bUndo" aria-label="تراجع خطوة"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button id="bBack" aria-label="جولة للخلف"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg></button>
    <button id="bPin" aria-label="ثبّت تمثالًا على دائرة"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="3"/><path d="M8.5 21v-5.5c0-2 1.6-3.5 3.5-3.5s3.5 1.5 3.5 3.5V21"/><path d="M5 21h14"/></svg></button>
    <button id="bHint" aria-label="تلميح"><svg viewBox="0 0 24 24"><path d="M7 15c-1.5 0-2.5-1.3-2.5-3.2S5.6 8 7 8s2.2 1.6 2.2 3.6S8.4 15 7 15z"/><path d="M15.5 20c-1.4 0-2.3-1.2-2.3-3s1-3.6 2.3-3.6 2.1 1.6 2.1 3.4-.8 3.2-2.1 3.2z"/><circle cx="6" cy="18.2" r="1"/><circle cx="17" cy="9.5" r="1"/></svg></button>
    <button id="bWatch" aria-label="شاهد الحل"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><path d="M10.5 9.5v5l4-2.5z" fill="currentColor"/></svg></button>
  </nav>
</div>

<script>
// ===== صدى — pure game logic (no rendering) — v0.2 =====
// Door kinds:
//   hold    — open while someone stands on its plate
//   timed   — like hold, but stays open TIMER more ticks after the plate is left
//   inverse — open by default, CLOSED while someone stands on its plate
// Any door with someone standing inside it stays open.
(function (root) {
  const DIRS = { U: [0, 1], D: [0, -1], L: [-1, 0], R: [1, 0], W: [0, 0] };
  const MOVES = ['U', 'D', 'L', 'R'];
  const TIMER = 3;

  function rng(seed) {
    let s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const clampI = (v, a, b) => Math.max(a, Math.min(b, v));
  const ri = (r, a, b) => a + Math.floor(r() * (b - a + 1));
  const pick = (r, arr) => arr[Math.floor(r() * arr.length)];
  const idx = (room, x, y) => y * room.W + x;
  const same = (a, b) => a.x === b.x && a.y === b.y;
  function doorAt(room, x, y) { for (let i = 0; i < room.doors.length; i++) if (room.doors[i].x === x && room.doors[i].y === y) return i; return -1; }

  // positions arrays carry .timers (one per door, 0 for non-timed)
  function withTimers(pos, timers) { pos.timers = timers; return pos; }
  function plateOn(room, pos, door) {
    return room.plates.some(p => p.door === door && (pos.some(e => e.x === p.x && e.y === p.y) || (room.pinned || []).some(e => e.x === p.x && e.y === p.y)));
  }

  function doorStates(room, pos) {
    const timers = pos.timers || [];
    return room.doors.map((d, i) => {
      const on = plateOn(room, pos, i);
      let open = d.kind === 'inverse' ? !on : (on || (d.kind === 'timed' && (timers[i] || 0) > 0));
      if (pos.some(e => e.x === d.x && e.y === d.y)) open = true;
      return open;
    });
  }

  function step(room, pos, actions) {
    const open = doorStates(room, pos);
    const next = pos.map((e, i) => {
      const d = DIRS[actions[i] || 'W'];
      const moving = !!(d[0] || d[1]);
      const nx = e.x + d[0], ny = e.y + d[1];
      if (nx < 0 || ny < 0 || nx >= room.W || ny >= room.H) return { x: e.x, y: e.y, blocked: moving };
      if (room.wall[idx(room, nx, ny)]) return { x: e.x, y: e.y, blocked: moving };
      const di = doorAt(room, nx, ny);
      if (di >= 0 && !open[di] && !(e.x === nx && e.y === ny)) return { x: e.x, y: e.y, blocked: true };
      return { x: nx, y: ny, blocked: false };
    });
    const t0 = pos.timers || [];
    return withTimers(next, room.doors.map((d, i) => d.kind !== 'timed' ? 0 : plateOn(room, pos, i) ? TIMER : Math.max(0, (t0[i] || 0) - 1)));
  }

  function startPos(room, n) { return withTimers(Array.from({ length: n }, () => ({ ...room.start })), room.doors.map(() => 0)); }

  // states[t] = positions (echoes..., player) after t ticks
  function run(room, echoes, player) {
    let pos = startPos(room, echoes.length + 1);
    const states = [pos];
    for (let t = 0; t < player.length; t++) {
      pos = step(room, pos, echoes.map(e => e[t] || 'W').concat([player[t]]));
      states.push(pos);
    }
    return states;
  }

  function bfsPath(room, from, to, doorsPassable) {
    const W = room.W, H = room.H, prev = new Int32Array(W * H).fill(-2);
    const q = [idx(room, from.x, from.y)]; prev[q[0]] = -1;
    let head = 0;
    while (head < q.length) {
      const c = q[head++]; const cx = c % W, cy = (c / W) | 0;
      if (cx === to.x && cy === to.y) {
        const path = []; let k = c;
        while (k !== -1) { path.push({ x: k % W, y: (k / W) | 0 }); k = prev[k]; }
        return path.reverse();
      }
      for (const m of MOVES) {
        const nx = cx + DIRS[m][0], ny = cy + DIRS[m][1];
        if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
        const n = idx(room, nx, ny);
        if (prev[n] !== -2 || room.wall[n]) continue;
        if (!doorsPassable) { const di = doorAt(room, nx, ny); if (di >= 0 && room.doors[di].kind !== 'inverse') continue; }
        prev[n] = c; q.push(n);
      }
    }
    return null;
  }

  // walk to each target in turn (shortest paths), waiting whenever the next step is blocked;
  // waits[k] extra ticks are spent standing on intermediate target k
  function routeMulti(room, echoes, targets, waits = []) {
    const acts = []; let from = { ...room.start };
    for (let k = 0; k < targets.length; k++) {
      const path = bfsPath(room, from, targets[k], true);
      if (!path) return null;
      let pi = 0, guard = 0;
      while (pi < path.length - 1 && guard++ < 40) {
        const states = run(room, echoes, acts);
        const pos = states[states.length - 1];
        const me = pos[pos.length - 1];
        const nxt = path[pi + 1];
        const m = MOVES.find(mm => me.x + DIRS[mm][0] === nxt.x && me.y + DIRS[mm][1] === nxt.y);
        const after = step(room, pos, echoes.map(e => e[acts.length] || 'W').concat([m]));
        if (same(after[after.length - 1], nxt)) { acts.push(m); pi++; } else acts.push('W');
      }
      if (pi !== path.length - 1) return null;
      if (k < targets.length - 1) for (let w = 0; w < (waits[k] || 0); w++) acts.push('W');
      from = targets[k];
    }
    return acts;
  }

  const plateOf = (room, door) => room.plates.find(p => p.door === door);

  // tasks: [[doorIdx, ...], ...] — one echo per task, pressing its doors' plates in order.
  // playerFirst: door indices whose plates the player presses on the way (timed doors only).
  function solveTasks(room, tasks, playerFirst = []) {
    const relay = tasks.map((t, i) => t.length > 1 ? i : -1).filter(i => i >= 0);
    const combos = relay.length ? cartesian(relay.map(() => [0, 1, 2, 3, 4, 5])) : [[]];
    for (const combo of combos) {
      const echoes = []; let ok = true;
      for (let j = 0; j < tasks.length; j++) {
        const waits = relay.includes(j) ? Array(tasks[j].length - 1).fill(combo[relay.indexOf(j)]) : [];
        const a = routeMulti(room, echoes, tasks[j].map(di => plateOf(room, di)), waits);
        if (!a) { ok = false; break; }
        echoes.push(a);
      }
      if (!ok) continue;
      for (const pw of [0, 1, 2]) {
        const targets = playerFirst.map(di => plateOf(room, di)).concat([room.exit]);
        const player = routeMulti(room, echoes, targets, playerFirst.map(() => pw));
        if (player && reaches(room, echoes, player)) return { echoes, player };
      }
    }
    return null;
  }
  function cartesian(lists) { return lists.reduce((acc, l) => acc.flatMap(a => l.map(x => a.concat([x]))), [[]]); }
  function reaches(room, echoes, player) {
    const L = Math.max(player.length, ...echoes.map(e => e.length), 0);
    const st = run(room, echoes.map(e => pad(e, L)), player);
    return same(st[st.length - 1][echoes.length], room.exit);
  }

  // exact check: can the player alone reach the exit within L ticks? (BFS over position + door timers)
  function aloneSolvable(room, L) {
    const start = startPos(room, 1);
    const key = p => p[0].x + ',' + p[0].y + '|' + p.timers.join('');
    let frontier = [start]; const seen = new Set([key(start)]);
    for (let t = 0; t < L; t++) {
      const nextF = [];
      for (const p of frontier) for (const a of ['U', 'D', 'L', 'R', 'W']) {
        const n = step(room, p, [a]);
        if (a !== 'W' && n[0].blocked) continue;
        if (same(n[0], room.exit)) return true;
        const k = key(n); if (!seen.has(k)) { seen.add(k); nextF.push(n); }
      }
      frontier = nextF;
    }
    return false;
  }

  function regionConnected(room, cells) {
    const set = new Set(cells.filter(([x, y]) => !room.wall[idx(room, x, y)]).map(([x, y]) => x + ',' + y));
    if (!set.size) return false;
    const first = set.values().next().value; const seen = new Set([first]); const q = [first];
    while (q.length) {
      const [x, y] = q.pop().split(',').map(Number);
      for (const m of MOVES) { const k = (x + DIRS[m][0]) + ',' + (y + DIRS[m][1]); if (set.has(k) && !seen.has(k)) { seen.add(k); q.push(k); } }
    }
    return seen.size === set.size;
  }

  // ---------- generator ----------
  function difficulty(level) {
    const k = level <= 2 ? 2 : level <= 8 ? 2 + (level % 2) : level <= 18 ? 3 : 3 + (level % 3 === 0 ? 1 : 0);
    return {
      k,
      W: level <= 3 ? 4 : level < 10 ? 5 : 6,
      deep: Math.min(0.6, 0.1 + level * 0.04),
      obst: Math.min(0.2, 0.05 + level * 0.01),
      slack: Math.max(1, 2 - Math.floor(level / 8)),
      tall: Math.min(0.6, 0.2 + level * 0.02),
      pTimed: level < 2 ? 0 : Math.min(0.6, 0.3 + level * 0.03),
      pInverse: level < 4 ? 0 : Math.min(0.4, 0.15 + level * 0.015),
      allowFull: level <= 1 ? 0.3 : 0.12, // chance to keep a room that needs one echo per gate
    };
  }

  // all ways to split n ordered gates into e contiguous groups
  function compositions(n, e) {
    const out = [];
    (function rec(startI, left, acc) {
      if (left === 1) { out.push(acc.concat([n - startI])); return; }
      for (let size = 1; size <= n - startI - (left - 1); size++) rec(startI + size, left - 1, acc.concat([size]));
    })(0, e, []);
    return out;
  }

  // fewest echoes that solve the room, by chaining consecutive gates onto one echo
  function minimalTasks(room) {
    const gates = room.doors.map((d, i) => i).filter(i => room.doors[i].kind !== 'inverse');
    for (let e = 1; e <= gates.length; e++) {
      for (const comp of compositions(gates.length, e)) {
        const tasks = []; let at = 0;
        for (const size of comp) { tasks.push(gates.slice(at, at + size)); at += size; }
        const sol = solveTasks(room, tasks);
        if (sol) return { tasks, sol };
      }
    }
    return null;
  }

  function generate(level, seed) {
    for (let attempt = 0; attempt < 400; attempt++) {
      const r = rng(seed + attempt * 7919);
      const d = difficulty(level);
      const k = d.k, W = d.W;
      const hs = []; for (let i = 0; i <= k; i++) hs.push(i === 0 ? 2 : r() < d.tall ? 2 : 1);
      const H = hs.reduce((a, b) => a + b, 0) + k;
      const room = { W, H, wall: new Uint8Array(W * H), doors: [], plates: [], regions: [] };
      let y = 0;
      for (let i = 0; i <= k; i++) {
        const rows = []; for (let j = 0; j < hs[i]; j++) rows.push(y + j);
        room.regions.push(rows); y += hs[i];
        if (i < k) {
          for (let x = 0; x < W; x++) room.wall[idx(room, x, y)] = 1;
          const px = room.doors.length ? room.doors[room.doors.length - 1].x : ri(r, 0, W - 1);
          const dx = clampI(px + ri(r, -2, 2), 0, W - 1); room.wall[idx(room, dx, y)] = 0;
          const kind = i > 0 && r() < d.pInverse ? 'inverse' : r() < d.pTimed ? 'timed' : 'hold';
          room.doors.push({ x: dx, y, kind });
          y++;
        }
      }
      const gateCount = room.doors.filter(dd => dd.kind !== 'inverse').length;
      if (gateCount < 1) continue;
      const cellsOf = i => { const c = []; for (const yy of room.regions[i]) for (let x = 0; x < W; x++) c.push([x, yy]); return c; };
      const near = new Set(); room.doors.forEach(dd => { near.add(dd.x + ',' + (dd.y - 1)); near.add(dd.x + ',' + (dd.y + 1)); });
      for (let i = 0; i <= k; i++) {
        const cells = cellsOf(i);
        for (const [x, yy] of cells) {
          if (near.has(x + ',' + yy) || r() > d.obst) continue;
          room.wall[idx(room, x, yy)] = 1;
          if (!regionConnected(room, cells)) room.wall[idx(room, x, yy)] = 0;
        }
      }
      const free = i => cellsOf(i).filter(([x, yy]) => !room.wall[idx(room, x, yy)] && !near.has(x + ',' + yy));
      const used = new Set();
      const take = list => { const c = list.filter(([x, yy]) => !used.has(x + ',' + yy)); if (!c.length) return null; const p = pick(r, c); used.add(p[0] + ',' + p[1]); return { x: p[0], y: p[1] }; };
      const bottom = free(0).filter(([, yy]) => yy === 0);
      room.start = take(bottom.length ? bottom : free(0));
      const topRow = free(k).filter(([, yy]) => yy === H - 1);
      room.exit = take(topRow.length ? topRow : free(k));
      if (!room.start || !room.exit) continue;

      // gate plates: mostly on the near side so one echo can walk between them
      let bad = false;
      for (let i = 0; i < k; i++) {
        if (room.doors[i].kind === 'inverse') continue;
        let reg = 0;
        if (i > 0 && r() < d.deep) reg = ri(r, 1, i);
        const minDist = room.doors[i].kind === 'timed' ? TIMER + 2 : 2;
        const p = take(free(reg).filter(([x, yy]) => Math.abs(x - room.doors[i].x) + Math.abs(yy - room.doors[i].y) >= minDist));
        if (!p) { bad = true; break; }
        room.plates.push({ x: p.x, y: p.y, door: i });
      }
      if (bad) continue;

      let best = minimalTasks(room);
      if (!best) continue;
      // the heart of v0.3: fewer echoes than gates, so echoes must move in sync with you
      if (best.tasks.length >= gateCount && r() > d.allowFull) continue;

      // inverse plates on cells an echo crosses
      let invOk = true;
      for (let i = 0; i < k; i++) {
        if (room.doors[i].kind !== 'inverse') continue;
        const sol = best.sol;
        const L0 = Math.max(sol.player.length, ...sol.echoes.map(e => e.length));
        const st = run(room, sol.echoes.map(e => pad(e, L0)), pad(sol.player, L0));
        const crossed = [];
        for (let t = 1; t < st.length; t++) for (let j = 0; j < sol.echoes.length; j++) {
          const c = st[t][j]; const key = c.x + ',' + c.y;
          if (used.has(key) || near.has(key) || doorAt(room, c.x, c.y) >= 0 || room.plates.some(p => same(p, c))) continue;
          if (sol.echoes.every((_, jj) => !same(st[st.length - 1][jj], c))) crossed.push([c.x, c.y]);
        }
        const p = crossed.length ? take(crossed) : null;
        if (!p) { invOk = false; break; }
        room.plates.push({ x: p.x, y: p.y, door: i });
        const again = solveTasks(room, best.tasks);
        if (!again) { invOk = false; break; }
        best = { tasks: best.tasks, sol: again };
      }
      if (!invOk) continue;

      const sol = best.sol;
      const len = Math.max(sol.player.length, ...sol.echoes.map(e => e.length));
      room.L = len + d.slack;
      room.E = best.tasks.length;
      room.par = room.E;
      room.tasks = best.tasks;
      room.solution = sol;
      if (!verify(room)) continue;
      room.seed = seed; room.level = level;
      room.features = {
        timed: room.doors.some(dd => dd.kind === 'timed'),
        sync: best.tasks.some(t => t.length > 1),

    const lfo = AC.createOscillator(), lg = AC.createGain(); lfo.frequency.value = .07; lg.gain.value = 220; lfo.connect(lg); lg.connect(f.frequency); lfo.start();
  } catch (e) { AC = null; }
}
const SCALE = [0, 2, 4, 7, 9, 12, 14, 16];
function tone(semi, dur, vol, type = 'sine', delay = 0) {
  if (!AC) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = 440 * Math.pow(2, (semi - 9) / 12);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .05);
}
function paper(vol = .05) {   // a soft rustle: filtered noise
  if (!AC) return;
  const len = .09, b = AC.createBuffer(1, AC.sampleRate * len, AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  f.type = 'bandpass'; f.frequency.value = 2400; f.Q.value = .8; g.gain.value = vol;

}
const SFX = {
  step: t => { paper(.035); tone(SCALE[t % SCALE.length] + 12, .25, .025); },
  wait: () => tone(7, .3, .03),
  bump: () => { tone(-12, .18, .06, 'triangle'); paper(.08); },
  door: open => { tone(open ? 16 : 9, .7, .04); tone(open ? 23 : 4, .9, .025, 'sine', .06); },
  plate: () => tone(19, .5, .035),
  echo: () => { [12, 16, 19, 24].forEach((s, k) => tone(s, 1.2, .03, 'sine', k * .07)); },
  rewind: () => { for (let k = 0; k < 5; k++) tone(24 - k * 3, .2, .02, 'sine', k * .04); },
  win: () => { [0, 4, 7, 12, 16, 19, 24].forEach((s, k) => tone(s + 12, 1.4, .035, 'sine', k * .08)); },
  hint: () => tone(21, .8, .03),
};
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

// ---------------- room flow (same rules as the 3D versions) ----------------
function loadRoom(n) {
  S.n = n; S.R = E.roomFor(n, S.runSeed);
  if (!S.R) { S.runSeed++; S.R = E.roomFor(n, S.runSeed); }
  S.echoes = []; S.acts = []; S.walk = []; S.won = false; S.busy = false; S.fails = 0; S.pinMode = false; hint = null; hover = -1;
  S.R.pinned = [];
  recompute(); doorFx = S.R.doors.map(() => ({ open: 0, lit: 0, flash: 0 })); plateFx = S.R.plates.map(() => ({ on: 0 }));
  spawnEnts(); doorsUpdate(true); layout(); ui(); save();
  S.enterT = performance.now();
  if (S.R.tutorial && n > 1 && !S.demoSeen[n] && S.started) { S.demoSeen[n] = 1; save(); setTimeout(() => startDemo(true), 900); }
}
function recompute() { S.states = E.run(S.R, S.echoes, S.acts); }
function doAction(a, fromDemo) {
  if (S.busy || S.won || S.rewinding || (S.demo && !fromDemo)) return false;
  if (S.acts.length >= S.R.L) return false;
  const t = S.acts.length, pos = cur();
  const acts = S.echoes.map(e => e[t] || 'W').concat([a]);
  const next = E.step(S.R, pos, acts), hero = ents[ents.length - 1], me = next[next.length - 1];
  if (a !== 'W' && me.blocked) {
    hero.face = a; hero.bump = 1; hero.t = 0; hero.fx = hero.tx = hero.x; hero.fy = hero.ty = hero.y; hero.dur = 220;
    setExpr(hero, 'oops', .7); SFX.bump(); buzz(15); S.walk = [];
    const d = E.DIRS[a], di = E.doorAt(S.R, pos[pos.length - 1].x + d[0], pos[pos.length - 1].y + d[1]); if (di >= 0) doorFx[di].flash = 1;
    burst(bx(hero.x + .5 + d[0] * .4), by(hero.y + .5 + d[1] * .4), ['#efe2c8', '#8d86b8'], 6, 120);
    return false;
  }
  S.acts.push(a); S.states.push(next);
  S.busy = true;
  next.forEach((n, i) => {
    const e = ents[i], act = acts[i];
    if (act !== 'W') e.face = act;
    e.fx = e.x; e.fy = e.y; e.t = 0; e.dur = TICK; e.still = 0;
    if (n.blocked && act !== 'W') e.bump = 1;
  });
  spread(next, false);
  next.forEach((n, i) => { ents[i].tx = n.x + ents[i].ox; ents[i].ty = n.y + ents[i].oy; });
  if (a === 'W') SFX.wait(); else SFX.step(t);
  doorsUpdate(false); ui();
  const left = S.R.L - S.acts.length;
  if (left <= 3 && left > 0) setExpr(hero, 'worry', 1.5);
  setTimeout(afterTick, TICK);
  return true;
}
function afterTick() {
  S.busy = false;
  const me = cur()[S.echoes.length];
  if (me.x === S.R.exit.x && me.y === S.R.exit.y) return win();
  if (S.acts.length >= S.R.L) {
    S.walk = [];
    if (S.echoes.length < S.R.E) setTimeout(endLoopAsEcho, 300);
    else if (S.demo) { stopDemo(); }
    else { S.fails++; setTimeout(retryLoop, 300); if (S.fails >= 2 && S.help > 0) $('bHint').classList.add('pulse'); }
    return;
  }

}
function pump() { if (S.walk.length && !S.busy) { const a = S.walk.shift(); if (!doAction(a, !!S.demo)) S.walk = []; } }
function doorsUpdate(silent) {
  const pos = cur(), open = E.doorStates(S.R, pos);
  open.forEach((o, i) => { const f = doorFx[i]; if (!silent && o !== f.was) { SFX.door(o); if (o) setExpr(ents[ents.length - 1], 'happy', .9); } f.was = o; f.target = o ? 1 : 0; });
  S.R.plates.forEach((p, j) => {
    const on = pos.some(e => e.x === p.x && e.y === p.y) || (S.R.pinned || []).some(e => e.x === p.x && e.y === p.y);
    if (on && !plateFx[j].was && !silent) { SFX.plate(); buzz(10); }
    plateFx[j].was = on; plateFx[j].target = on ? 1 : 0;
  });
}
function endLoopAsEcho() {
  if (S.won || S.rewinding) return;
  S.echoes.push(E.pad(S.acts, S.R.L));
  rewind(() => { S.acts = []; recompute(); spawnEnts(); const g = ents[S.echoes.length - 1]; g.pop = 0; doorsUpdate(true); ui(); SFX.echo(); });
}
function retryLoop() { if (S.won || S.rewinding) return; rewind(() => { S.acts = []; recompute(); spawnEnts(); doorsUpdate(true); ui(); }); }
function backLoop() {
  if (S.demo) return stopDemo();
  if (S.busy || S.won || S.rewinding) return;
  if (!S.acts.length && !S.echoes.length) return;
  S.walk = []; setPin(false);
  rewind(() => { if (!S.acts.length && S.echoes.length) S.echoes.pop(); S.acts = []; recompute(); spawnEnts(); doorsUpdate(true); ui(); });
}
function undo() {
  if (S.demo) return stopDemo();
  if (S.busy || S.won || S.rewinding || !S.acts.length) return;
  S.walk = []; S.acts.pop(); S.states.pop(); spread(cur(), true); doorsUpdate(true); ui(); tone(4, .2, .03);
}
// rewind: the characters glide back along their paths; the paper "inhales"
function rewind(done) {
  S.rewinding = true; SFX.rewind(); buzz([8, 30, 8]);
  const steps = S.acts.length, total = Math.min(900, 160 + steps * 50), t0 = performance.now(), states = S.states;
  if (!steps) { S.rewinding = false; done(); return; }
  (function f() {
    const k = clamp((performance.now() - t0) / total, 0, 1), p = (1 - ease(k)) * steps, i0 = Math.floor(p), fr = p - i0;
    const a = states[Math.min(i0 + 1, steps)], b = states[i0];
    ents.forEach((e, i) => { if (!a[i]) return; e.x = lerp(b[i].x, a[i].x, fr); e.y = lerp(b[i].y, a[i].y, fr); e.t = 1; e.moving = true; e.walkPh -= .4; });
    S.rewindK = k;
    if (k < 1) requestAnimationFrame(f); else { S.rewinding = false; S.rewindK = 0; done(); }
  })();
}
function win() {
  S.won = true;
  const hero = ents[ents.length - 1];
  setExpr(hero, 'cheer', 2.5); hero.jumpV = 1.6; hero.jump = .01;
  SFX.win(); buzz([20, 40, 20]);
  burst(sx(S.R.exit.x), sy(S.R.exit.y), ['#ffb547', '#efe2c8', '#ff6fae', '#7cf0b5', '#8fd8ff'], 40, 260);
  if (S.demo) { setTimeout(() => { stopDemo(); toast('▶'); }, 900); return; }
  S.solved++;
  if (S.solved % 3 === 0 && S.help < MAX_HELP) S.help++;
  setTimeout(() => { S.transT = performance.now(); setTimeout(() => loadRoom(S.n + 1), 380); }, 1300);
}
function walkTo(c) {
  const me = cur()[S.echoes.length];
  if (c.x === me.x && c.y === me.y) { S.walk = ['W']; pump(); return; }
  const path = E.bfsPath(S.R, me, c, true);
  if (!path) { SFX.bump(); return; }
  S.walk = [];
  for (let k = 1; k < path.length; k++) {
    const dx = path[k].x - path[k - 1].x, dy = path[k].y - path[k - 1].y;
    S.walk.push(dx === 1 ? 'R' : dx === -1 ? 'L' : dy === 1 ? 'U' : 'D');

}
function useHelp() { if (S.R.tutorial) return true; if (S.help <= 0) { SFX.bump(); return false; } S.help--; ui(); return true; }
function showHint() {
  if (S.demo) return stopDemo();
  if (S.busy || S.won || S.rewinding || !S.R.solution) return;
  if (!useHelp()) return;
  $('bHint').classList.remove('pulse');
  const sol = S.R.solution, seq = S.echoes.length < sol.echoes.length ? sol.echoes[S.echoes.length] : sol.player;
  let p = { ...S.R.start }; const cells = []; let t = 0;
  for (const a of seq) { t++; const d = E.DIRS[a]; if (d[0] || d[1]) { p = { x: p.x + d[0], y: p.y + d[1] }; cells.push({ ...p, t }); } }
  hint = { cells, until: performance.now() + 9000 }; SFX.hint();
}
function setPin(on) { S.pinMode = on; $('bPin').classList.toggle('armed', on); }
function pinPress() {
  if (S.demo) return stopDemo();
  if (S.busy || S.won || S.rewinding) return;
  if (S.pinMode) return setPin(false);
  if (!S.R.tutorial && S.help <= 0) { SFX.bump(); return; }
  setPin(true); toast('◎');
}
function pinAt(c) {
  const plate = S.R.plates.find(p => p.x === c.x && p.y === c.y && S.R.doors[p.door].kind !== 'inverse');
  setPin(false);
  if (!plate || S.R.pinned.some(p => p.x === c.x && p.y === c.y)) return;
  if (!useHelp()) return;
  S.R.pinned.push({ x: c.x, y: c.y });
  recompute(); doorsUpdate(false); ui(); tone(12, .6, .04);
}
function startDemo(free) {
  if (S.busy || S.won || S.rewinding || S.demo || !S.R.solution) return;
  if (!free && !useHelp()) return;
  const sol = S.R.solution, q = [];
  sol.echoes.forEach(e => q.push(...E.pad(e, S.R.L)));
  q.push(...sol.player);
  S.walk = []; setPin(false); S.R.pinned = [];
  S.echoes = []; S.acts = []; recompute(); spawnEnts(); doorsUpdate(true); ui();
  S.demo = { q, iv: setInterval(() => { const d = S.demo; if (!d || S.busy || S.rewinding || S.won || S.acts.length >= S.R.L) return; if (!d.q.length) return stopDemo(); doAction(d.q.shift(), true); }, 40) };
  $('bWatch').classList.add('armed');
}
function stopDemo() {
  if (!S.demo) return;
  clearInterval(S.demo.iv); S.demo = null; $('bWatch').classList.remove('armed');
  S.won = false; S.echoes = []; S.acts = []; S.walk = []; recompute(); spawnEnts(); doorsUpdate(true); ui();
}
let toastT = 0;
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 900); }
function ui() {
  $('room').textContent = AR(S.n);
  const h = $('helps'); h.innerHTML = '';
  for (let k = 0; k < MAX_HELP; k++) { const i = document.createElement('i'); if (k >= S.help) i.className = 'off'; h.appendChild(i); }
  const free = S.R && S.R.tutorial;
  for (const id of ['bHint', 'bPin', 'bWatch']) $(id).classList.toggle('dim', !free && S.help <= 0);
  $('bBack').classList.toggle('dim', !S.acts.length && !S.echoes.length);
  $('bUndo').classList.toggle('dim', !S.acts.length);
}

// ---------------- input: swipe to step, tap a cell to walk there ----------------
let touch = null;
function cellAt(px, py) { return { x: Math.floor((px - OX) / CS), y: S.R.H - 1 - Math.floor((py - OY) / CS) }; }
cv.addEventListener('pointerdown', e => { touch = { x: e.clientX, y: e.clientY, t: performance.now() }; const r = cv.getBoundingClientRect(); const c = cellAt(e.clientX - r.left, e.clientY - r.top); hover = hoverDoor(c); });
cv.addEventListener('pointerup', e => {
  if (!touch || !S.started) return;
  const dx = e.clientX - touch.x, dy = e.clientY - touch.y, r = cv.getBoundingClientRect();
  touch = null; setTimeout(() => (hover = -1), 900);
  if (S.demo) return stopDemo();
  if (Math.hypot(dx, dy) > 24) {
    const a = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U');
    S.walk = []; doAction(a); return;
  }
  const c = cellAt(e.clientX - r.left, e.clientY - r.top);
  if (c.x < 0 || c.y < 0 || c.x >= S.R.W || c.y >= S.R.H) return;
  if (S.pinMode) return pinAt(c);
  if (S.busy) { const me = cur()[S.echoes.length]; S.walk = []; setTimeout(() => walkTo(c), TICK); return; }
  walkTo(c);
});
function hoverDoor(c) {
  if (!S.R) return -1;
  const d = E.doorAt(S.R, c.x, c.y); if (d >= 0) return d;
  const p = S.R.plates.find(p => p.x === c.x && p.y === c.y); return p ? p.door : -1;
}
window.addEventListener('keydown', e => {
  const k = { ArrowUp: 'U', ArrowDown: 'D', ArrowLeft: 'L', ArrowRight: 'R', ' ': 'W' }[e.key];
  if (k && S.started) { e.preventDefault(); S.walk = []; doAction(k); }
  if (e.key === 'z' || e.key === 'Backspace') undo();
});
$('bWait').onclick = () => { S.walk = []; doAction('W'); };
$('bUndo').onclick = undo;
$('bBack').onclick = backLoop;
$('bHint').onclick = showHint;
$('bPin').onclick = pinPress;
$('bWatch').onclick = () => (S.demo ? stopDemo() : startDemo(false));
function begin() {
  if (S.started) return;
  S.started = true; audioStart();
  const t = $('title'); t.style.transition = 'opacity .6s'; t.style.opacity = 0; setTimeout(() => (t.hidden = true), 600);
  if (S.R.tutorial && S.n > 1 && !S.demoSeen[S.n]) { S.demoSeen[S.n] = 1; save(); setTimeout(() => startDemo(true), 700); }
}
$('title').addEventListener('pointerup', begin);
$('title').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') begin(); });

// ---------------- frame ----------------
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; const T = now / 1000;
  if (!S.R || !staticLayer) { requestAnimationFrame(frame); return; }
  ents.forEach(e => { updEnt(e, dt, T); if (e.pop < 1) e.pop = Math.min(1, e.pop + dt * 3); });
  doorFx.forEach(f => { f.open += ((f.target || 0) - f.open) * Math.min(1, dt * 9); f.lit += (((hover >= 0 && doorFx[hover] === f) ? 1 : 0) - f.lit) * Math.min(1, dt * 6); });
  plateFx.forEach((f, j) => { f.on += ((f.target || 0) - f.on) * Math.min(1, dt * 12); f.hover = hover >= 0 && S.R.plates[j].door === hover ? 1 : 0; });
  const heroE = ents[ents.length - 1];
  S.nearExit = heroE ? clamp(1 - (Math.hypot(heroE.x - S.R.exit.x, heroE.y - S.R.exit.y) - 1) / 3, 0, 1) : 0;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#151330'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // room entrance: the paper sheet slides up into place
  const ent = clamp((now - (S.enterT || 0)) / 600, 0, 1), out = S.transT ? clamp((now - S.transT) / 380, 0, 1) : 0;
  if (ent >= 1 && S.transT && !S.won) S.transT = 0;
  const slide = (1 - ease(ent)) * 40 + ease(out) * -40;
  ctx.globalAlpha = Math.min(ease(ent), 1 - out);
  ctx.translate(0, slide);
  ctx.drawImage(staticLayer, 0, 0, cv.width / DPR, cv.height / DPR);

  // lights: the hero's lantern, the echoes' pale lanterns, the exit, lit plates
  const open = E.doorStates(S.R, cur()), lights = [];
  ents.forEach(e => lights.push({ x: e.x + .5, y: e.y + .55, r: e.ghost ? 2.3 : 3.6 + Math.sin(T * 9) * .04, a: e.ghost ? .7 : 1, tint: e.ghost ? 'rgba(80,150,220,.16)' : 'rgba(255,160,60,.22)' }));
  lights.push({ x: S.R.exit.x + .5, y: S.R.exit.y + .5, r: 2.2 + S.nearExit * .8, a: .85, tint: 'rgba(255,190,90,.14)' });
  S.R.plates.forEach((p, j) => { if (plateFx[j].on > .3) lights.push({ x: p.x + .5, y: p.y + .5, r: 1.3, a: .6 * plateFx[j].on, tint: 'rgba(255,255,255,.0)' }); });
  LIGHTS = lights;
  // floor shadows: cast by walls and closed doors (on the floor plane, under everything standing)
  drawLights(lights, open);
  drawExit(T);
  S.R.plates.forEach((p, j) => drawPlate(j, T));
  drawHint(T);
  // depth-sorted: far rows first; walls, doors and characters interleave (3/4 view)
  const items = [];
  for (let y = 0; y < S.R.H; y++) for (let x = 0; x < S.R.W; x++) if (S.R.wall[y * S.R.W + x]) items.push({ d: y + .02, f: () => drawWall(x, y) });
  S.R.doors.forEach((d, i) => items.push({ d: d.y + .02, f: () => drawDoor(i, T) }));
  ents.forEach(e => items.push({ d: e.y, f: () => drawEnt(e, T) }));
  items.sort((a, b) => b.d - a.d).forEach(it => it.f());
  drawLink(T);
  drawParts(dt);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (S.rewindK) { ctx.fillStyle = `rgba(143,216,255,${Math.sin(S.rewindK * Math.PI) * .08})`; ctx.fillRect(0, 0, VW, VH); }
  drawTicks(T);
  requestAnimationFrame(frame);
}

// test hook (used by the automated play test; harmless for players)
window.__sada = { S, doAction, loadRoom, cur, get ents() { return ents; }, startDemo, showHint };

load();
window.addEventListener('resize', resize);
loadRoom(S.n);
resize();
requestAnimationFrame(frame);
})();
