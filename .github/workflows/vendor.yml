name: vendor
# Fetches pinned third-party files into vendor/ and commits them, so the game has no external links.
on:
  push:
    paths: ['tools/vendor.sh', '.github/workflows/vendor.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash tools/vendor.sh
      - name: commit vendor/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor
          git diff --cached --quiet || git commit -m "vendor: three.js والخطوط محليًا"
          git push
