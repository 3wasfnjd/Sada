name: quest-apk
# Builds, tests and verifies the Quest APK (quest/), then commits it to the `quest-apk` branch
# (apk + sha256 + reports) so it can be downloaded directly. Sideload test build, test key.
on:
  push:
    branches: [dev]
    paths: ['quest/**', '.github/workflows/quest-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: quest-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/sada-godot
          key: godot-4.6.3-stable-v1
      - name: Build, test and verify APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          OUT_DIR: ${{ github.workspace }}/build
        run: bash quest/tools/ci/build_apk.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sada-quest-${{ github.run_number }}
          path: |
            build/*.apk
            build/*.sha256
            build/*.txt
            build/export.log
          if-no-files-found: warn
      - name: Commit APK to the quest-apk branch
        run: |
          set -e
          SRC="${{ github.sha }}"
          mkdir /tmp/out && cp build/*.apk build/*.sha256 build/*.txt /tmp/out/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan quest-apk-new
          git rm -rq --cached . && git clean -fdq -e build
          rm -rf build
          cp /tmp/out/* .
          printf 'Sada Quest sideload build %s from %s\n' "${{ github.run_number }}" "$SRC" > README.md
          git add -A
          git commit -qm "Quest APK build ${{ github.run_number }} from ${SRC:0:7}"
          git push -f origin HEAD:quest-apk
