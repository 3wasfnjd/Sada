name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: index.html (طيف web) matches mobile/ + src/logic.js
        run: node tools/build.mjs --check
      - name: syntax check of the web game
        run: node --check mobile/game.js
      - name: every generated room is solvable
        run: node tests/generator.test.mjs
