name: optimize
# Drop a heavy model in models_src/ (glb, gltf, fbx or obj; optional <name>.json with settings).
# This makes a light game-ready version in assets/ with baked colour + normal maps, plus a comparison image.
on:
  push:
    paths: ['models_src/**', 'tools/blender/optimize.py', 'tools/blender/rig_small.py', '.github/workflows/optimize.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - run: sudo apt-get update -q && sudo apt-get install -y -q libxi6 libxkbcommon0 libsm6 libxrender1 libgl1 libegl1 libxxf86vm1 libxfixes3
      - name: download Blender 4.5 LTS
        run: |
          F=$(curl -s https://download.blender.org/release/Blender4.5/ | grep -o 'blender-4\.5\.[0-9]*-linux-x64\.tar\.xz' | sort -uV | tail -1)
          curl -sSL "https://download.blender.org/release/Blender4.5/$F" | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/${F%.tar.xz}" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: glTF decoder (meshopt / quantization -> plain glTF for Blender)
        run: cd tools/blender && npm init -y >/dev/null && npm i --no-save @gltf-transform/core@4.1.1 @gltf-transform/extensions@4.1.1 @gltf-transform/functions@4.1.1 meshoptimizer@0.22.0
      - name: optimize every source model
        run: |
          shopt -s nullglob
          mkdir -p "$RUNNER_TEMP/src"
          for f in models_src/*.{glb,gltf,fbx,obj}; do
            b="${f%.*}"; in="$f"
            case "$f" in *.glb|*.gltf) in="$RUNNER_TEMP/src/$(basename "$f")"; node tools/blender/decode.mjs "$f" "$in" ;; esac
            blender -b --python-exit-code 1 -P tools/blender/optimize.py -- "$in" assets docs/previews "$b.json"
            # variants of the same source: <name>.<variant>.json (e.g. gnome.quest.json -> a sharper Quest version)
            for v in "$b".*.json; do
              blender -b --python-exit-code 1 -P tools/blender/optimize.py -- "$in" assets docs/previews "$v"
            done
          done
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets docs/previews
          git diff --cached --quiet || git commit -m "optimize: game-ready models from models_src"
          git pull --rebase   # other model workflows may have pushed meanwhile
          git push
